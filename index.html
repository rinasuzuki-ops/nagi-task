// ============ 今日タブ ============
function TodayTab({ data, toggleDone, onEdit, onSchedule, cloudCfg, showToast, onSetDue, onPatch, onGoBig, onGoWait, fresh, onClearFresh }) {
  const [showAllUndated, setShowAllUndated] = useState(false);
  const [daySet, setDaySetState] = useState(loadDaySet());
  const [slot, setSlot] = useState(null);
  const setDaySet = function (s) { saveDaySet(s); setDaySetState(s); };
  const [events, setEvents] = useState(null);
  const [evLoading, setEvLoading] = useState(false);
  const [evError, setEvError] = useState("");

  const today = todayStr();
  const youbi = ["日","月","火","水","木","金","土"][new Date().getDay()];
  const connected = cloudCfg && cloudCfg.url;

  const loadCal = function () {
    if (!connected) return;
    setEvLoading(true); setEvError("");
    fetch(cloudCfg.url + "?token=" + encodeURIComponent(cloudCfg.token) + "&action=calendar")
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && Array.isArray(res.events)) setEvents(res.events);
        else setEvError("カレンダーを取得できませんでした。GASコードを最新版に貼り替えて「デプロイを管理→新バージョン」で更新し、権限を再承認してください。");
        setEvLoading(false);
      })
      .catch(function () { setEvError("カレンダーの取得に失敗しました"); setEvLoading(false); });
  };
  useEffect(function () { loadCal(); }, []);

  const openTasks = data.tasks.filter(function (t) { return t.status !== "done"; });
  const plannedToday = openTasks.filter(function (t) { return t.planned && t.planned.date === today; });
  const dueTasks = openTasks.filter(function (t) { return t.due && daysUntil(t.due) <= 0; });
  const ids = {};
  dueTasks.concat(plannedToday).forEach(function (t) { ids[t.id] = true; });
  const todayTasks = openTasks.filter(function (t) { return ids[t.id] && !t.waiting; })
    .sort(function (a, b) { return (a.due ? daysUntil(a.due) : 9999) - (b.due ? daysUntil(b.due) : 9999); });
  const startSoon = openTasks.filter(function (t) { return !ids[t.id] && !t.waiting && !isBig(t, data.tasks) && shouldStart(t); })
    .sort(function (a, b) { return daysUntil(a.due) - daysUntil(b.due); });
  const bigs = openTasks.filter(function (t) { return isBig(t, data.tasks); })
    .sort(sortByDue)
    .map(function (t) { return { t: t, info: bigInfo(t, data.tasks) }; });
  const undated = openTasks.filter(function (t) { return !t.due && !t.parentId && !t.repeat && !t.waiting; });
  const waitingList = openTasks.filter(function (t) { return t.waiting; }).sort(function (a, b) {
    const ra = a.remindAt || "9999-99-99", rb = b.remindAt || "9999-99-99";
    return ra < rb ? -1 : ra > rb ? 1 : 0;
  });
  const remindNow = waitingList.filter(function (t) { return t.remindAt && daysUntil(t.remindAt) <= 0; }).length;
  const shownIds = {};
  todayTasks.concat(startSoon).forEach(function (t) { shownIds[t.id] = true; });
  const quickList = openTasks.filter(function (t) { return (t.mode === "quick" || t.mode === "ai") && !t.waiting && !shownIds[t.id]; })
    .sort(function (a, b) { return a.mode === b.mode ? sortByDue(a, b) : (a.mode === "quick" ? -1 : 1); });
  const dailyAll = openTasks.filter(function (t) { return t.mode === "daily" && !t.waiting; }).sort(sortByDue);
  const slotCandidates = (function () {
    const seen = {}, out = [];
    const push = function (list, why, color, prefix) {
      list.forEach(function (t) {
        if (!t || seen[t.id] || t.waiting || t.status === "done") return;
        if (t.planned && t.planned.date === today) return;
        if (isBig(t, data.tasks) && childrenOf(data.tasks, t.id).length) return; // 分解済みの大物はステップで出す
        seen[t.id] = true;
        out.push({ t: t, why: why, color: color, prefix: prefix });
      });
    };
    push(todayTasks, "今日まで・期限切れ", "var(--accent)");
    push(startSoon, "🔥 そろそろ着手", "#A65E00");
    push(bigs.map(function (b) { return b.info.next; }), "🏔 大物の次の一歩", "var(--ink)");
    push(bigs.filter(function (b) { return b.info.total === 0; }).map(function (b) { return b.t; }), "🏔 大物(分解する時間に)", "var(--ink)");
    push(openTasks.filter(function (t) { return t.mode === "block"; }).sort(sortByDue), "🧱 まとまった時間が必要", "#9A5B12");
    push(dailyAll, "🐢 毎日少しずつ", "#2C7A6B");
    push(openTasks.filter(function (t) { return t.mode === "quick" || t.mode === "ai"; }).sort(sortByDue), "⚡ スキマ時間で片づく", "#2E6B50");
    push(openTasks.filter(function (t) { return t.due; }).sort(sortByDue), "期限が近い順", "var(--gray)");
    return out.slice(0, 15);
  })();
  const dailyDone = dailyAll.filter(function (t) { return t.touchedAt === today; }).length;
  const blockList = openTasks.filter(function (t) {
    return t.mode === "block" && !t.waiting && !(t.planned && t.planned.date && daysUntil(t.planned.date) >= 0);
  }).sort(sortByDue);
  const freshTasks = data.tasks.filter(function (t) { return fresh && fresh[t.id]; });

  const evList = events || [];
  const timeline = evList.map(function (e) { return { kind: "event", title: e.title, start: e.allDay ? "" : e.start, end: e.allDay ? "" : e.end, allDay: !!e.allDay }; })
    .concat(plannedToday.map(function (t) { return { kind: "task", title: t.title, start: t.planned.start, end: t.planned.end, task: t }; }))
    .sort(function (a, b) { return (a.allDay ? "00:00" : a.start || "99:99").localeCompare(b.allDay ? "00:00" : b.start || "99:99"); });

  const meetingMin = calcDay(evList, plannedToday, daySet, 0).meetingMin;
  const fmtMin = function (min) { return Math.floor(min / 60) + "時間" + (min % 60 ? (min % 60) + "分" : ""); };
  const doneToday = data.tasks.filter(function (t) { return t.status === "done" && t.doneAt === today; });

  const copyNippo = function () {
    const lines = [];
    lines.push("【" + fmtDate(today) + "(" + youbi + ") 日報用メモ】");
    lines.push("");
    lines.push("■会議・予定: 合計 " + (meetingMin ? fmtMin(meetingMin) : "0分"));
    const workEv = evList.filter(function (e) {
      if (e.allDay || daySet.ignore.indexOf(e.title) >= 0) return false;
      const s = toMin(e.start), en = toMin(e.end);
      return !(s !== null && en !== null && en > s && (en <= daySet.start * 60 || s >= daySet.end * 60));
    });
    workEv.forEach(function (e) { lines.push("・" + e.start + "〜" + e.end + " " + e.title + (e.minutes ? "(" + e.minutes + "分)" : "")); });
    if (!workEv.length) lines.push("・(予定なし)");
    lines.push("");
    lines.push("■完了したタスク(" + doneToday.length + "件)");
    doneToday.forEach(function (t) { lines.push("・" + t.title); });
    if (!doneToday.length) lines.push("・(なし)");
    lines.push("");
    if (waitingList.length) {
      lines.push("■相手待ち(" + waitingList.length + "件)");
      waitingList.forEach(function (t) { lines.push("・" + t.title + (t.waitFor ? "(" + t.waitFor + "待ち)" : "")); });
      lines.push("");
    }
    const touched = data.tasks.filter(function (t) { return t.touchedAt === today && t.status !== "done"; });
    if (touched.length) {
      lines.push("■少しずつ進めたもの");
      touched.forEach(function (t) { lines.push("・" + t.title); });
      lines.push("");
    }
    lines.push("■実行予定・進行中");
    plannedToday.forEach(function (t) { lines.push("・" + t.planned.start + "〜 " + t.title); });
    todayTasks.filter(function (t) { return !(t.planned && t.planned.date === today); }).forEach(function (t) { lines.push("・" + t.title + (t.due ? "(期限 " + fmtDate(t.due) + ")" : "")); });
    copyText(lines.join("\n"), function () { showToast("日報用メモをコピーしました"); });
  };

  return (
    <div>
      <div className="row mb3" style={{ justifyContent: "space-between" }}>
        <div className="bold xs" style={{ color: "var(--ink)", fontSize: "14px" }}>{fmtDate(today)}({youbi})</div>
        <div className="row">
          <button className="btn btn-ghost btn-sm" onClick={copyNippo}>📋 日報用にコピー</button>
          {connected && <button className="btn btn-ink btn-sm" onClick={loadCal} disabled={evLoading}>{evLoading ? "↻ 取得中…" : "🔄 予定を更新"}</button>}
        </div>
      </div>

      <DayTimeline events={evList} planned={plannedToday} daySet={daySet} onDaySet={setDaySet}
        onEditTask={onEdit} onPickSlot={setSlot} connected={connected} loading={evLoading} error={evError} />
      {slot && (
        <SlotPickModal slot={slot} candidates={slotCandidates} allTags={data.tags}
          onClose={function () { setSlot(null); }}
          onPick={function (t) {
            const len = slot.e - slot.s;
            setSlot(null);
            onSchedule(t, { date: today, start: toHM(slot.s), dur: len });
          }} />
      )}

      {freshTasks.length > 0 && <FreshSummary tasks={freshTasks} fresh={fresh} onEdit={onEdit} onClear={onClearFresh} />}

      {waitingList.length > 0 && (
        <button className="card row mb4" onClick={onGoWait}
          style={{ width: "100%", textAlign: "left", padding: "10px 12px", borderLeft: "4px solid " + (remindNow ? "var(--accent)" : "#8A5AB2"), background: remindNow ? "#FFF6F4" : "#fff" }}>
          <span className="flex1" style={{ fontSize: "13px" }}>
            {remindNow > 0
              ? <b style={{ color: "var(--accent)" }}>📣 催促どきの相手待ちが{remindNow}件</b>
              : <span style={{ color: "#6B4E8A" }}>⏳ 相手待ち {waitingList.length}件(催促どきはまだなし)</span>}
          </span>
          <span className="small bold" style={{ color: "var(--ink-soft)", flexShrink: 0 }}>待ちタブへ →</span>
        </button>
      )}

      <div className="label mb2">今日やるタスク({todayTasks.length}件) — 期限切れ・今日期限・今日に予定したもの</div>
      <div className="stack">
        {todayTasks.length === 0 && <div className="center muted xs" style={{ padding: "24px 0" }}>今日期限のタスクはありません 🍺</div>}
        {todayTasks.map(function (t) {
          return <TaskCard key={t.id} t={t} allTags={data.tags} toggleDone={toggleDone} onEdit={onEdit} onSchedule={onSchedule} />;
        })}
      </div>

      <div className="mt4">
        <div className="row mb2" style={{ justifyContent: "space-between" }}>
          <div className="label" style={{ marginBottom: 0, color: "var(--ink)" }}>🏔 大物の次の一歩({bigs.length}件)</div>
          <button className="small bold" style={{ color: "var(--ink-soft)" }} onClick={onGoBig}>大物タブへ →</button>
        </div>
        {bigs.length === 0 && (
          <div className="small muted" style={{ padding: "4px 0 8px" }}>時間がかかるタスクは「かかる量: 大」にすると、ここで毎日見張ります</div>
        )}
        <div className="stack">
          {bigs.map(function (b) {
            return <BigMini key={b.t.id} b={b} toggleDone={toggleDone} onEdit={onEdit} onGoBig={onGoBig} />;
          })}
        </div>
      </div>

      {startSoon.length > 0 && (
        <div className="mt4">
          <div className="label mb2" style={{ color: "#A65E00" }}>🔥 そろそろ着手(期限はまだ先だけど、かかる量的に今日始めたい)</div>
          <div className="stack">
            {startSoon.map(function (t) {
              return <TaskCard key={t.id} t={t} allTags={data.tags} toggleDone={toggleDone} onEdit={onEdit} onSchedule={onSchedule} />;
            })}
          </div>
        </div>
      )}

      {dailyAll.length > 0 && (
        <div className="mt4">
          <div className="label mb1" style={{ color: "#2C7A6B" }}>🐢 毎日少しずつ(今日の分 {dailyDone}/{dailyAll.length} 進めた)</div>
          <div className="small muted mb2">終わらなくてOK。少しでも手をつけたら「今日ちょっと進めた」</div>
          <div className="stack">
            {dailyAll.map(function (t) {
              const touched = t.touchedAt === today;
              return (
                <div key={t.id} style={{ opacity: touched ? .55 : 1 }}>
                  <TaskCard t={t} allTags={data.tags} toggleDone={toggleDone} onEdit={onEdit} onSchedule={onSchedule} />
                  <button className="btn btn-sm btn-block mt1" disabled={touched}
                    style={touched ? { background: "#EAF4F1", color: "#2C7A6B" } : { background: "#2C7A6B", color: "#fff" }}
                    onClick={function () { onPatch(t.id, { touchedAt: today }, "ナイス!今日の分OK 🐢"); }}>
                    {touched ? "✓ 今日は進めた" : "🐢 今日ちょっと進めた"}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {blockList.length > 0 && (
        <div className="mt4">
          <div className="label mb1" style={{ color: "#9A5B12" }}>🧱 まとまった時間を確保しよう({blockList.length}件)</div>
          <div className="small muted mb2">スキマ時間では進まないもの。⏰で時間をおさえてカレンダーに入れておこう</div>
          <div className="stack">
            {blockList.map(function (t) {
              return <TaskCard key={t.id} t={t} allTags={data.tags} toggleDone={toggleDone} onEdit={onEdit} onSchedule={onSchedule} />;
            })}
          </div>
        </div>
      )}

      {quickList.length > 0 && (
        <div className="mt4">
          <div className="label mb1" style={{ color: "#2E6B50" }}>⚡ スキマ時間で片づく({quickList.length}件)</div>
          <div className="small muted mb2">会議の合間の15分に。🤖はClaudeに投げればOKなもの</div>
          <div className="stack">
            {quickList.slice(0, 6).map(function (t) {
              return <TaskCard key={t.id} t={t} allTags={data.tags} toggleDone={toggleDone} onEdit={onEdit} onSchedule={onSchedule} />;
            })}
          </div>
        </div>
      )}

      {undated.length > 0 && (
        <div className="mt4">
          <div className="label mb1" style={{ color: "#6B4E8A" }}>📌 期限を決めよう({undated.length}件)</div>
          <div className="small muted mb2">期限がないタスクはずっと浮上してきません。迷ったら「金曜」で仮置きでもOK</div>
          <div className="stack">
            {(showAllUndated ? undated : undated.slice(0, 5)).map(function (t) {
              return (
                <div key={t.id} className="card" style={{ padding: "10px 12px", borderLeft: "4px solid " + (IMP_COLOR[t.importance] || "var(--gray)") }}>
                  <div style={{ fontSize: "13px", cursor: "pointer", wordBreak: "break-word" }} onClick={function () { onEdit(t); }}>
                    {isBig(t, data.tasks) ? "🏔 " : ""}{t.title}
                    <span className="small muted"> ・作成 {fmtDate(day10(t.createdAt))}</span>
                  </div>
                  <QuickDateChips value="" onPick={function (v) { onSetDue(t.id, v); }} />
                </div>
              );
            })}
          </div>
          {undated.length > 5 && (
            <button className="small muted mt2" onClick={function () { setShowAllUndated(!showAllUndated); }}>
              {showAllUndated ? "▲ たたむ" : "▼ 残り" + (undated.length - 5) + "件も表示"}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ============ シートからの変更(たたんで表示) ============
function FreshSummary({ tasks, fresh, onEdit, onClear }) {
  const [open, setOpen] = useState(false);
  const [allUpd, setAllUpd] = useState(false);
  const news = tasks.filter(function (t) { return fresh[t.id] === "new"; });
  const upds = tasks.filter(function (t) { return fresh[t.id] === "upd"; });
  const row = function (t) {
    return (
      <button key={t.id} className="row" onClick={function () { onEdit(t); }}
        style={{ width: "100%", textAlign: "left", padding: "7px 0", borderTop: "1px solid var(--line)" }}>
        <span className="flex1" style={{ fontSize: "12px", wordBreak: "break-word", color: t.status === "done" ? "var(--gray)" : "inherit" }}>{t.status === "done" ? "✓ " : ""}{t.title}</span>
        {t.due && <span className="small muted" style={{ flexShrink: 0 }}>{fmtDate(t.due)}</span>}
      </button>
    );
  };
  const updShown = allUpd ? upds : upds.slice(0, 8);
  return (
    <div className="card mb4" style={{ padding: "10px 12px", borderLeft: "4px solid #3B5BA5" }}>
      <div className="row" style={{ justifyContent: "space-between" }}>
        <button className="flex1" style={{ textAlign: "left", color: "#3B5BA5", fontWeight: 700, fontSize: "13px" }} onClick={function () { setOpen(!open); }}>
          🆕 シートから {news.length ? "新規" + news.length + "件" : ""}{news.length && upds.length ? "・" : ""}{upds.length ? "更新" + upds.length + "件" : ""}
          <span className="small muted" style={{ marginLeft: "6px" }}>{open ? "▲ たたむ" : "▼ 見る"}</span>
        </button>
        <button className="btn btn-ghost btn-sm" onClick={onClear}>確認OK</button>
      </div>
      {open && (
        <div className="mt2">
          {news.length > 0 && <div className="small bold mt1 mb1" style={{ color: "#3B5BA5" }}>新しく追加されたタスク</div>}
          {news.map(row)}
          {upds.length > 0 && <div className="small bold mt3 mb1 muted">内容が変わったタスク</div>}
          {updShown.map(row)}
          {upds.length > 8 && !allUpd && (
            <button className="small muted mt1" onClick={function () { setAllUpd(true); }}>▼ 残り{upds.length - 8}件も表示</button>
          )}
        </div>
      )}
    </div>
  );
}

// ============ 相手待ちカード ============
function WaitCard({ t, onEdit, onPatch, toggleDone }) {
  const ctx = React.useContext(AppCtx);
  const parent = t.parentId ? ctx.tasks.find(function (x) { return x.id === t.parentId; }) : null;
  const wd = waitDays(t);
  const due = t.remindAt ? daysUntil(t.remindAt) : null;
  const hot = due !== null && due <= 0;
  return (
    <div className="card" style={{ padding: "10px 12px", borderLeft: "4px solid " + (hot ? "var(--accent)" : "#8A5AB2"), background: hot ? "#FFF6F4" : "#fff" }}>
      {parent && <div className="small muted" style={{ marginBottom: "2px" }}>🏔 {parent.title} のステップ</div>}
      <div style={{ fontSize: "13px", fontWeight: 500, cursor: "pointer", wordBreak: "break-word" }} onClick={function () { onEdit(t); }}>{t.title}</div>
      <div className="wrap mt1">
        <span className="chip bold" style={{ background: "#F1EAF6", color: "#6B4E8A" }}>⏳ {t.waitFor ? t.waitFor + "待ち" : "相手待ち"}{wd !== null ? "・" + (wd <= 0 ? "今日から" : wd + "日目") : ""}</span>
        {t.remindAt && <span className="chip bold" style={hot ? { background: "#FBE3DF", color: "var(--accent)" } : { background: "var(--bg)", color: "var(--ink-soft)" }}>📣 {hot ? "催促どき(" + fmtDate(t.remindAt) + ")" : fmtDate(t.remindAt) + " に催促"}</span>}
        {t.due && <span className="chip" style={{ background: dueInfo(t.due, "open").bg, color: dueInfo(t.due, "open").fg }}>期限 {dueInfo(t.due, "open").label}</span>}
      </div>
      <div className="row mt2">
        <button className="btn btn-ghost btn-sm flex1" onClick={function () { onPatch(t.id, { waiting: false, waitSince: "", remindAt: "" }, "自分ボールに戻しました"); }}>📥 戻ってきた</button>
        <button className="btn btn-ghost btn-sm flex1" onClick={function () { onPatch(t.id, { remindAt: plusDaysStr(3) }, "催促済み。次は " + fmtDate(plusDaysStr(3)) + " に確認します"); }}>📣 催促した(+3日)</button>
        <button className="btn btn-ghost btn-sm" onClick={function () { toggleDone(t.id); }}>✓ 完了</button>
      </div>
    </div>
  );
}

// ============ 待ちタブ ============
function WaitTab({ data, toggleDone, onEdit, onPatch, onNewWait }) {
  const [who, setWho] = useState("all");
  const NONAME = "(相手未記入)";
  const list = data.tasks.filter(isWaiting);
  const people = {};
  list.forEach(function (t) { const k = t.waitFor || NONAME; people[k] = (people[k] || 0) + 1; });
  const names = Object.keys(people).sort(function (a, b) { return people[b] - people[a]; });
  const byRemind = function (a, b) {
    const ra = a.remindAt || "9999-99-99", rb = b.remindAt || "9999-99-99";
    return ra < rb ? -1 : ra > rb ? 1 : 0;
  };
  const shown = list.filter(function (t) { return who === "all" || (t.waitFor || NONAME) === who; }).sort(byRemind);
  const hot = shown.filter(function (t) { return t.remindAt && daysUntil(t.remindAt) <= 0; });
  const calm = shown.filter(function (t) { return !(t.remindAt && daysUntil(t.remindAt) <= 0); });
  const chipStyle = function (on) {
    return on ? { background: "#8A5AB2", color: "#fff", padding: "5px 12px" } : { background: "#fff", color: "#6B4E8A", border: "1px solid #E6DAF0", padding: "5px 12px" };
  };

  return (
    <div>
      <div className="card mb3" style={{ background: "#FBF8FD" }}>
        <div className="bold" style={{ fontSize: "14px", color: "#6B4E8A" }}>⏳ 相手待ち</div>
        <div className="small muted mt1" style={{ lineHeight: 1.7 }}>
          ボールが相手にあるタスク。催促日になると上の「📣 催促どき」に上がってきます。<br />
          返事が来たら「📥 戻ってきた」で、自分のタスクに戻ります。
        </div>
        <div className="row mt3" style={{ justifyContent: "space-between" }}>
          <button className="btn btn-sm" style={{ background: "#8A5AB2", color: "#fff" }} onClick={onNewWait}>＋ 相手待ちを追加</button>
          <span className="small muted">合計 {list.length}件</span>
        </div>
      </div>

      {names.length > 1 && (
        <div className="wrap mb3">
          <button className="chip bold" style={chipStyle(who === "all")} onClick={function () { setWho("all"); }}>全員 {list.length}</button>
          {names.map(function (n) {
            return <button key={n} className="chip bold" style={chipStyle(who === n)} onClick={function () { setWho(n); }}>{n} {people[n]}</button>;
          })}
        </div>
      )}

      {list.length === 0 && (
        <div className="center muted xs" style={{ padding: "32px 0", lineHeight: 1.8 }}>
          相手待ちのタスクはありません。<br />タスクの編集画面で「⏳ 相手待ち」にすると、ここに集まります。
        </div>
      )}

      {hot.length > 0 && (
        <div className="mb4">
          <div className="label mb2" style={{ color: "var(--accent)" }}>📣 催促どき({hot.length}件)</div>
          <div className="stack">
            {hot.map(function (t) { return <WaitCard key={t.id} t={t} onEdit={onEdit} onPatch={onPatch} toggleDone={toggleDone} />; })}
          </div>
        </div>
      )}
      {calm.length > 0 && (
        <div>
          <div className="label mb2" style={{ color: "#6B4E8A" }}>⏳ 返事待ち({calm.length}件)</div>
          <div className="stack">
            {calm.map(function (t) { return <WaitCard key={t.id} t={t} onEdit={onEdit} onPatch={onPatch} toggleDone={toggleDone} />; })}
          </div>
        </div>
      )}
    </div>
  );
}

// ============ 大物ミニカード(今日タブ用) ============
function BigMini({ b, toggleDone, onEdit, onGoBig }) {
  const t = b.t, info = b.info;
  const d = dueInfo(t.due, t.status);
  const pct = info.total ? Math.round(info.doneCount / info.total * 100) : 0;
  return (
    <div className="card" style={{ padding: "10px 12px", borderLeft: "4px solid " + (IMP_COLOR[t.importance] || "var(--gray)") }}>
      <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
        <div className="flex1" style={{ fontSize: "13px", fontWeight: 700, cursor: "pointer", wordBreak: "break-word" }} onClick={function () { onEdit(t); }}>{t.title}</div>
        <span className="chip" style={{ background: d.bg, color: d.fg, flexShrink: 0 }}>{d.label}</span>
      </div>
      {info.total > 0 ? (
        <React.Fragment>
          <div className="row mt2">
            <div className="progress-track flex1"><div className="progress-fill" style={{ width: pct + "%" }} /></div>
            <span className="small muted">{info.doneCount}/{info.total}</span>
          </div>
          {info.next ? (
            <div className="row mt2" style={{ background: "var(--bg)", borderRadius: "8px", padding: "6px 8px" }}>
              <button className="check-circle" style={{ flexShrink: 0 }} title="このステップを完了" onClick={function () { toggleDone(info.next.id); }}></button>
              <div className="flex1 xs" style={{ cursor: "pointer", wordBreak: "break-word" }} onClick={function () { onEdit(info.next); }}>{info.next.waiting ? "⏳ 待ち: " : "👉 次: "}{info.next.title}{info.next.waiting && info.next.waitFor ? "(" + info.next.waitFor + ")" : ""}</div>
              {info.next.due
                ? <span className="chip" style={{ background: dueInfo(info.next.due, "open").bg, color: dueInfo(info.next.due, "open").fg, flexShrink: 0 }}>{dueInfo(info.next.due, "open").label}</span>
                : <span className="small" style={{ color: "#B09A5A", flexShrink: 0 }}>期限なし</span>}
            </div>
          ) : (
            <div className="small mt2" style={{ color: "#2E6B50" }}>🎉 全ステップ完了。大物タスク自体を完了にしよう</div>
          )}
        </React.Fragment>
      ) : (
        <button className="btn btn-sm mt2" style={{ background: "#FDEBD2", color: "#A65E00" }} onClick={onGoBig}>⚠ まだ分解されていません → ステップに分ける</button>
      )}
      {info.idle !== null && info.idle >= 3 && (
        <div className="small bold mt2" style={{ color: "var(--accent)" }}>💤 {info.idle}日動いていません</div>
      )}
    </div>
  );
}

// ============ メモタブ ============
function MemoTab({ data, update, onMakeTask, showToast }) {
  const [mode, setMode] = useState("memo");
  const [text, setText] = useState("");
  const inputRef = useRef(null);

  const addMemo = function () {
    const v = text.trim();
    if (!v) return;
    update(Object.assign({}, data, { memos: [{ id: uid(), text: v, createdAt: new Date().toISOString() }].concat(data.memos) }));
    setText("");
    if (inputRef.current) inputRef.current.focus();
  };
  const deleteMemo = function (id) {
    update(Object.assign({}, data, { memos: data.memos.filter(function (m) { return m.id !== id; }) }));
  };

  const openQ = (data.questions || []).filter(function (q) { return !q.answeredAt; }).length;
  const seg = (
    <div className="row mb3" style={{ background: "#E6EAF1", borderRadius: "10px", padding: "3px" }}>
      {[{ k: "memo", label: "✏️ メモ", n: data.memos.length }, { k: "ask", label: "💬 聞きたい", n: openQ }].map(function (o) {
        const on = mode === o.k;
        return (
          <button key={o.k} className="flex1 bold" onClick={function () { setMode(o.k); }}
            style={{ padding: "8px 0", borderRadius: "8px", fontSize: "13px", background: on ? "#fff" : "transparent", color: on ? "var(--ink)" : "var(--gray)", boxShadow: on ? "0 1px 3px rgba(20,28,48,.12)" : "none" }}>
            {o.label}{o.n ? " " + o.n : ""}
          </button>
        );
      })}
    </div>
  );
  if (mode === "ask") return <div>{seg}<QuestionPanel data={data} update={update} onMakeTask={onMakeTask} showToast={showToast} /></div>;

  return (
    <div>
      {seg}
      <div className="card">
        <div className="label mb2">気づいたら、すぐメモ</div>
        <div className="row">
          <input ref={inputRef} className="input flex1" value={text}
            onChange={function (e) { setText(e.target.value); }}
            onKeyDown={function (e) { if (e.key === "Enter") addMemo(); }}
            placeholder="例: ビザ更新の店舗リマインド送る" />
          <button className="btn btn-ink" onClick={addMemo}>追加</button>
        </div>
      </div>

      <div className="stack mt4">
        {data.memos.length === 0 && (
          <div className="center muted xs" style={{ padding: "40px 0" }}>
            メモはまだありません。<br />思いついたことを書き留めると、ここに溜まります。
          </div>
        )}
        {data.memos.map(function (m) {
          return (
            <div key={m.id} className="card row-start">
              <div className="flex1">
                <div className="xs" style={{ wordBreak: "break-word", fontSize: "13px" }}>{m.text}</div>
                <div className="small muted mt1">
                  {new Date(m.createdAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: "4px", flexShrink: 0 }}>
                <button className="btn btn-accent btn-sm" onClick={function () { onMakeTask(m); }}>タスク化</button>
                <button className="btn btn-sm muted" onClick={function () { deleteMemo(m.id); }}>削除</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============ 聞きたいことメモ ============
const CLAUDE_WHO = "🤖 Claude";
function QuestionPanel({ data, update, onMakeTask, showToast }) {
  const qs = data.questions || [];
  const open = qs.filter(function (q) { return !q.answeredAt; });
  const done = qs.filter(function (q) { return q.answeredAt; })
    .sort(function (a, b) { return (b.answeredAt || "") < (a.answeredAt || "") ? -1 : 1; });
  // よく使う相手(最近の順)
  const people = ["村上さん", "西谷さん", "生田さん"]; // いつもの相手は最初から
  qs.slice().sort(function (a, b) { return (b.createdAt || "") < (a.createdAt || "") ? -1 : 1; })
    .forEach(function (q) { if (q.who && q.who !== CLAUDE_WHO && people.indexOf(q.who) === -1) people.push(q.who); });

  const [text, setText] = useState("");
  const [who, setWho] = useState(qs.length ? (qs[0].who || CLAUDE_WHO) : CLAUDE_WHO);
  const [newWho, setNewWho] = useState("");
  const [addingWho, setAddingWho] = useState(false);
  const [editing, setEditing] = useState(null);
  const [answer, setAnswer] = useState("");
  const [showDone, setShowDone] = useState(false);
  const inputRef = useRef(null);

  const save = function (list) { update(Object.assign({}, data, { questions: list })); };
  const add = function () {
    const v = text.trim();
    if (!v) return;
    const w = (addingWho && newWho.trim()) ? newWho.trim() : who;
    save([{ id: uid(), text: v, who: w, createdAt: new Date().toISOString(), answeredAt: "", answer: "" }].concat(qs));
    setText(""); setWho(w); setNewWho(""); setAddingWho(false);
    if (inputRef.current) inputRef.current.focus();
  };
  const markDone = function (id) {
    save(qs.map(function (q) { return q.id === id ? Object.assign({}, q, { answeredAt: todayStr(), answer: answer.trim() }) : q; }));
    setEditing(null); setAnswer("");
    showToast("聞けた!メモしておきました");
  };
  const reopen = function (id) { save(qs.map(function (q) { return q.id === id ? Object.assign({}, q, { answeredAt: "" }) : q; })); };
  const del = function (id) { save(qs.filter(function (q) { return q.id !== id; })); };

  const claudePrompt = function (items) {
    return "壁打ちに付き合ってください。いきなり答えを出すのではなく、質問しながら一緒に考えを整理してほしいです。\n\n" +
      "考えたいこと:\n" + items.map(function (q) { return "・" + q.text; }).join("\n") +
      "\n\nまず" + (items.length > 1 ? "1つ目から、" : "") + "前提を確認する質問を1つずつしてください。";
  };
  const copyGroup = function (name, items) {
    const s = name === CLAUDE_WHO
      ? claudePrompt(items)
      : "【" + name + "に聞きたいこと】\n" + items.map(function (q) { return "・" + q.text; }).join("\n");
    copyText(s, function () { showToast(name === CLAUDE_WHO ? "壁打ち用の文をコピーしました。Claudeに貼ってください" : "コピーしました"); });
  };

  // 相手ごとにまとめる(Claude → 件数の多い順)
  const groups = {};
  open.forEach(function (q) { const k = q.who || "(相手未定)"; (groups[k] = groups[k] || []).push(q); });
  const names = Object.keys(groups).sort(function (a, b) {
    if (a === CLAUDE_WHO) return -1; if (b === CLAUDE_WHO) return 1;
    return groups[b].length - groups[a].length;
  });

  const whoChip = function (name) {
    const on = !addingWho && who === name;
    return (
      <button key={name} className="chip bold" onClick={function () { setWho(name); setAddingWho(false); }}
        style={on ? { background: "var(--ink)", color: "#fff", padding: "5px 11px" } : { background: "var(--bg)", color: "var(--ink-soft)", border: "1px solid var(--line)", padding: "5px 11px" }}>
        {name}
      </button>
    );
  };

  return (
    <div>
      <div className="card">
        <div className="label mb2">聞きたいこと・考えたいことをメモ</div>
        <div className="row">
          <input ref={inputRef} className="input flex1" value={text}
            onChange={function (e) { setText(e.target.value); }}
            onKeyDown={function (e) { if (e.key === "Enter" && !e.isComposing) add(); }}
            placeholder="例: 2号の処遇、どこまで上げる?" />
          <button className="btn btn-ink" onClick={add}>追加</button>
        </div>
        <div className="small muted mt2 mb1">誰に聞く?</div>
        <div className="wrap">
          {whoChip(CLAUDE_WHO)}
          {people.slice(0, 10).map(whoChip)}
          <button className="chip bold" onClick={function () { setAddingWho(true); }}
            style={addingWho ? { background: "var(--ink)", color: "#fff", padding: "5px 11px" } : { background: "#fff", color: "var(--gray)", border: "1px dashed var(--line)", padding: "5px 11px" }}>
            ＋ ほかの人
          </button>
        </div>
        {addingWho && (
          <input className="input mt2" value={newWho} onChange={function (e) { setNewWho(e.target.value); }} placeholder="例: 村上さん / 西谷さん / 幹部塾" />
        )}
      </div>

      {open.length === 0 && (
        <div className="center muted xs" style={{ padding: "32px 0", lineHeight: 1.8 }}>
          聞きたいことはまだありません。<br />「これ誰かに聞きたい」「Claudeと壁打ちしたい」と思ったら、ここに置いておこう。
        </div>
      )}

      {names.map(function (name) {
        const items = groups[name];
        const isClaude = name === CLAUDE_WHO;
        return (
          <div key={name} className="mt4">
            <div className="row mb2" style={{ justifyContent: "space-between" }}>
              <div className="label" style={{ marginBottom: 0, color: isClaude ? "#3B5BA5" : "var(--ink)" }}>{isClaude ? "🤖 Claudeと壁打ち" : "💬 " + name + "に聞く"}({items.length})</div>
              <button className="btn btn-ghost btn-sm" onClick={function () { copyGroup(name, items); }}>
                {isClaude ? "📋 壁打ち用にコピー" : "📋 まとめてコピー"}
              </button>
            </div>
            <div className="stack">
              {items.map(function (q) {
                return (
                  <div key={q.id} className="card" style={{ padding: "10px 12px", borderLeft: "4px solid " + (isClaude ? "#3B5BA5" : "#C97B2D") }}>
                    <div style={{ fontSize: "13px", wordBreak: "break-word" }}>{q.text}</div>
                    <div className="small muted mt1">{q.createdAt ? fmtDate(day10(q.createdAt)) + " にメモ" : ""}</div>
                    {editing === q.id ? (
                      <div className="mt2">
                        <textarea className="textarea input" rows={2} value={answer} onChange={function (e) { setAnswer(e.target.value); }} placeholder="わかったこと・答えをひとことメモ(空欄でもOK)" />
                        <div className="row mt2">
                          <button className="btn btn-ink btn-sm flex1" onClick={function () { markDone(q.id); }}>✓ 聞けたにする</button>
                          <button className="btn btn-ghost btn-sm" onClick={function () { setEditing(null); setAnswer(""); }}>キャンセル</button>
                        </div>
                      </div>
                    ) : (
                      <div className="row mt2" style={{ flexWrap: "wrap" }}>
                        <button className="btn btn-ghost btn-sm" onClick={function () { setEditing(q.id); setAnswer(q.answer || ""); }}>✓ 聞けた</button>
                        {isClaude && <button className="btn btn-ghost btn-sm" onClick={function () { copyText(claudePrompt([q]), function () { showToast("壁打ち用の文をコピーしました"); }); }}>📋 これだけコピー</button>}
                        <button className="btn btn-ghost btn-sm" onClick={function () { onMakeTask({ id: "", text: q.text }); }}>→ タスクにする</button>
                        <button className="small muted" style={{ marginLeft: "auto" }} onClick={function () { if (window.confirm("このメモを削除しますか?")) del(q.id); }}>削除</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {done.length > 0 && (
        <div className="mt4">
          <button className="small bold muted" onClick={function () { setShowDone(!showDone); }}>
            {showDone ? "▲ 聞けたことを隠す" : "▼ 聞けたこと(" + done.length + "件)"}
          </button>
          {showDone && (
            <div className="stack mt2">
              {done.map(function (q) {
                return (
                  <div key={q.id} className="card" style={{ padding: "9px 12px", opacity: .75 }}>
                    <div className="small muted">{q.who} ・ {fmtDate(q.answeredAt)} に聞けた</div>
                    <div style={{ fontSize: "13px", wordBreak: "break-word" }}>{q.text}</div>
                    {q.answer && <div className="small mt1" style={{ background: "var(--bg)", borderRadius: "6px", padding: "6px 8px", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>💡 {q.answer}</div>}
                    <div className="row mt1">
                      <button className="small muted" onClick={function () { reopen(q.id); }}>未解決に戻す</button>
                      <button className="small muted" style={{ marginLeft: "auto" }} onClick={function () { if (window.confirm("削除しますか?")) del(q.id); }}>削除</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ============ タスクタブ ============
function TaskTab({ data, toggleDone, onNew, onEdit, onSchedule, onSetTagColor, onDeleteTag }) {
  const [filterBall, setFilterBall] = useState("all");
  const [showTagColors, setShowTagColors] = useState(false);
  const [filterState, setFilterState] = useState("open");
  const [filterAssignee, setFilterAssignee] = useState("all");
  const [filterImp, setFilterImp] = useState("all");
  const [filterTag, setFilterTag] = useState("all");
  const [showSteps, setShowSteps] = useState(false);

  const assignees = ["自分"].concat(data.members.map(function (m) { return m.name; }));

  let list = data.tasks.filter(function (t) {
    if (filterState === "open" && t.status === "done") return false;
    if (filterState === "done" && t.status !== "done") return false;
    if (filterState === "nodue" && (t.status === "done" || t.due)) return false;
    if (!showSteps && t.parentId) return false;
    if (filterBall === "me" && t.waiting) return false;
    if (filterBall === "wait" && !t.waiting) return false;
    if (["quick", "ai", "daily", "block"].indexOf(filterBall) >= 0 && t.mode !== filterBall) return false;
    if (filterAssignee !== "all" && t.assignee !== filterAssignee) return false;
    if (filterImp !== "all" && t.importance !== filterImp) return false;
    if (filterTag !== "all" && (t.tags || []).indexOf(filterTag) === -1) return false;
    return true;
  });
  const impRank = { "高": 0, "中": 1, "低": 2 };
  list = list.slice().sort(function (a, b) {
    const da = a.due ? daysUntil(a.due) : 9999;
    const db = b.due ? daysUntil(b.due) : 9999;
    if (da !== db) return da - db;
    const ra = impRank[a.importance] !== undefined ? impRank[a.importance] : 1;
    const rb = impRank[b.importance] !== undefined ? impRank[b.importance] : 1;
    return ra - rb;
  });

  const open = data.tasks.filter(function (t) { return t.status !== "done"; });
  const stats = {
    overdue: open.filter(function (t) { return t.due && daysUntil(t.due) < 0; }).length,
    today: open.filter(function (t) { return t.due && daysUntil(t.due) === 0; }).length,
    open: open.length,
    wait: open.filter(function (t) { return t.waiting; }).length,
  };

  return (
    <div>
      <div className="mb3" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "8px" }}>
        {[
          { n: stats.overdue, label: "期限切れ", color: stats.overdue > 0 ? "var(--accent)" : "var(--ink)" },
          { n: stats.today, label: "今日まで", color: stats.today > 0 ? "var(--amber)" : "var(--ink)" },
          { n: stats.wait, label: "相手待ち", color: stats.wait > 0 ? "#8A5AB2" : "var(--ink)" },
          { n: stats.open, label: "未完了", color: "var(--ink)" },
        ].map(function (s, i) {
          return (
            <div key={i} className="card center" style={{ padding: "8px" }}>
              <div className="bold" style={{ fontSize: "17px", color: s.color }}>{s.n}</div>
              <div className="small muted">{s.label}</div>
            </div>
          );
        })}
      </div>

      <div className="filters mb3">
        <select className="select" value={filterState} onChange={function (e) { setFilterState(e.target.value); }}>
          <option value="open">未完了</option><option value="nodue">📌 期限なしだけ</option><option value="done">完了済み</option><option value="all">すべて</option>
        </select>
        <select className="select" value={filterBall} onChange={function (e) { setFilterBall(e.target.value); }}>
          <option value="all">ボール: 全部</option><option value="me">🙋 自分ボール</option><option value="wait">⏳ 相手待ち</option>
          <option value="quick">⚡ すぐできる</option><option value="ai">🤖 AIでいける</option>
          <option value="daily">🐢 毎日少しずつ</option><option value="block">🧱 時間をとる</option>
        </select>
        <select className="select" value={filterTag} onChange={function (e) { setFilterTag(e.target.value); }}>
          <option value="all">🏷 全タグ</option>
          {data.tags.map(function (t) { return <option key={t} value={t}>{t}</option>; })}
        </select>
        <select className="select" value={filterImp} onChange={function (e) { setFilterImp(e.target.value); }}>
          <option value="all">重要度: 全部</option><option value="高">高のみ</option><option value="中">中のみ</option><option value="低">低のみ</option>
        </select>
        <button className="btn btn-ink btn-sm" style={{ marginLeft: "auto", flexShrink: 0 }} onClick={onNew}>＋ 新規</button>
      </div>
      <div className="row mb3" style={{ justifyContent: "space-between", flexWrap: "wrap" }}>
        <label className="small muted row" style={{ gap: "4px" }}>
          <input type="checkbox" checked={showSteps} onChange={function (e) { setShowSteps(e.target.checked); }} />
          大物のステップも表示
        </label>
        <button className="btn btn-ghost btn-sm" onClick={function () { setShowTagColors(true); }}>🏷 タグ管理(色・削除)</button>
      </div>
      {showTagColors && <TagColorModal tags={data.tags} tasks={data.tasks} colors={data.tagColors || {}} onSet={onSetTagColor} onDelete={onDeleteTag} onClose={function () { setShowTagColors(false); }} />}

      <div className="stack">
        {list.length === 0 && <div className="center muted xs" style={{ padding: "40px 0" }}>該当するタスクはありません</div>}
        {list.map(function (t) {
          return <TaskCard key={t.id} t={t} allTags={data.tags} toggleDone={toggleDone} onEdit={onEdit} onSchedule={onSchedule} />;
        })}
      </div>
    </div>
  );
}

function TaskCard({ t, allTags, toggleDone, onEdit, onSchedule }) {
  const ctx = React.useContext(AppCtx);
  const d = dueInfo(t.due, t.status);
  const done = t.status === "done";
  const fr = ctx.fresh && ctx.fresh[t.id] === "new" ? "new" : null;
  const parent = t.parentId ? ctx.tasks.find(function (x) { return x.id === t.parentId; }) : null;
  const steps = !t.parentId ? ctx.tasks.filter(function (x) { return x.parentId === t.id; }) : [];
  const stepsDone = steps.filter(function (x) { return x.status === "done"; }).length;
  return (
    <div className="task-card" style={{ opacity: done ? .55 : 1, boxShadow: fr ? "0 0 0 2px #3B5BA5" : undefined, background: isWaiting(t) ? "#FBF8FD" : "#fff" }}>
      <div className="imp-bar" style={{ background: IMP_COLOR[t.importance] || "var(--gray)" }} />
      <button className="check-btn" onClick={function () { toggleDone(t.id); }} aria-label="完了切り替え">
        <span className={"check-circle" + (done ? " done" : "")}>{done ? "✓" : ""}</span>
      </button>
      <div className="flex1" style={{ padding: "10px 8px 10px 0", cursor: "pointer" }} onClick={function () { onEdit(t); }}>
        {parent && <div className="small muted" style={{ marginBottom: "2px", wordBreak: "break-word" }}>🏔 {parent.title} のステップ</div>}
        <div style={{ fontSize: "13px", fontWeight: 500, wordBreak: "break-word", textDecoration: done ? "line-through" : "none" }}>
          {t.repeat ? "🔁 " : ""}{t.title}
        </div>
        <div className="wrap" style={{ marginTop: "6px" }}>
          {fr && <span className="chip bold" style={{ background: "#E3EAF8", color: "#3B5BA5" }}>{fr === "new" ? "🆕 シートから追加" : "🔄 シートで更新"}</span>}
          <span className="chip" style={{ background: d.bg, color: d.fg }}>{d.label}</span>
          <span className="chip bold" style={{ background: IMP_COLOR[t.importance] || "var(--gray)", color: "#fff" }}>{t.importance}</span>
          {steps.length > 0 && <span className="chip bold" style={{ background: "#EAEEF6", color: "var(--ink)" }}>🏔 {stepsDone}/{steps.length}</span>}
          {!steps.length && t.effort === "大" && !t.parentId && <span className="chip bold" style={{ background: "#FDEBD2", color: "#A65E00" }}>🏔 未分解</span>}
          {(t.tags || []).map(function (tag) {
            return <span key={tag} className="chip" style={{ background: tagColor(tag, allTags), color: "#fff" }}>{tag}</span>;
          })}
          {t.assignee && t.assignee !== "自分" && <span className="chip" style={{ background: "#EAEEF6", color: "var(--ink-soft)" }}>👤 {t.assignee}</span>}
          {shouldStart(t) && <span className="chip bold" style={{ background: "#FDEBD2", color: "#A65E00" }}>🔥 着手推奨</span>}
          {t.requester && <span className="chip" style={{ background: "#F1EAF6", color: "#6B4E8A" }}>📩 {t.requester}</span>}
          {isWaiting(t) && <span className="chip bold" style={{ background: "#EDE3F5", color: "#6B4E8A" }}>⏳ {t.waitFor ? t.waitFor + "待ち" : "相手待ち"}{waitDays(t) > 0 ? " " + waitDays(t) + "日" : ""}</span>}
          {t.mode && MODE_LABEL[t.mode] && t.status !== "done" && <span className="chip bold" style={MODE_STYLE[t.mode]}>{MODE_LABEL[t.mode]}</span>}
          {t.planned && <span className="chip" style={{ background: "#E4F0EA", color: "#2E6B50" }}>⏰ {fmtDate(t.planned.date)} {t.planned.start}</span>}
        </div>
      </div>
      {onSchedule && !done && (
        <button style={{ padding: "0 8px", fontSize: "18px", flexShrink: 0 }} title="いつやるか決めてカレンダーに登録"
          onClick={function (e) { e.stopPropagation(); onSchedule(t); }}>
          ⏰
        </button>
      )}
    </div>
  );
}

// ============ タスク編集モーダル ============
function TaskModal({ task, members, allTags, allTasks, impGuide, onSaveGuide, onSave, onDelete, onClose }) {
  const [t, setT] = useState(Object.assign({ tags: [], repeat: "", repeatDays: [], requester: "", effort: "中", parentId: "" }, task));
  const hasChildren = (allTasks || []).some(function (x) { return x.parentId === task.id; });
  const parentOptions = (allTasks || []).filter(function (x) {
    return x.id !== task.id && !x.parentId && (x.status !== "done" || x.id === t.parentId);
  });
  const [newTags, setNewTags] = useState([]);
  const [tagInput, setTagInput] = useState("");
  const [showGuide, setShowGuide] = useState(false);
  const [guideText, setGuideText] = useState(impGuide);

  const isNew = !task.title && task.source === "direct";
  const assignees = ["自分"].concat(members.map(function (m) { return m.name; }));
  if (t.assignee && assignees.indexOf(t.assignee) === -1) assignees.push(t.assignee);

  const displayTags = allTags.concat(newTags.filter(function (n) { return allTags.indexOf(n) === -1; }));

  const set = function (k, v) { setT(function (p) { const n = Object.assign({}, p); n[k] = v; return n; }); };
  const toggleTag = function (name) {
    const cur = t.tags || [];
    set("tags", cur.indexOf(name) >= 0 ? cur.filter(function (x) { return x !== name; }) : cur.concat([name]));
  };
  const addNewTag = function () {
    const v = tagInput.trim();

function ScheduleModal({ task, onPlanned, showToast, cloudCfg, onClose }) {
  const [date, setDate] = useState((task.planned && task.planned.date) || todayStr());
  const init = task._init || null;
  const [start, setStart] = useState((init && init.start) || (task.planned && task.planned.start) || "10:00");
  const [dur, setDur] = useState(function () {
    if (!init || !init.dur) return 60;
    const opts = [15, 30, 60, 90, 120].filter(function (x) { return x <= init.dur; });
    return opts.length ? opts[opts.length - 1] : 15;
  });
  const [busy, setBusy] = useState(false);
  const connected = cloudCfg && cloudCfg.url;

  const endTime = function () {
    const p = start.split(":").map(Number);
    const total = p[0] * 60 + (p[1] || 0) + Number(dur);
    return String(Math.floor(total / 60) % 24).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
  };
  const autoRegister = function () {
    if (!connected || busy) return;
    setBusy(true);
    const end = endTime();
    fetch(cloudCfg.url, { method: "POST", body: JSON.stringify({ token: cloudCfg.token, action: "addEvent", event: { title: "【タスク】" + task.title, date: date, start: start, end: end } }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        setBusy(false);
        if (res && res.ok) {
          onPlanned(task.id, { date: date, start: start, end: end });
          showToast("📅 カレンダーに登録しました");
          onClose();
        } else {
          window.alert("登録に失敗しました。GASコードを最新版に貼り替えて「デプロイを管理→新バージョン」で更新し、カレンダー権限を承認してください。");
        }
      })
      .catch(function () { setBusy(false); window.alert("登録に失敗しました。通信環境を確認してください。"); });
  };
  const openGcal = function () {
    const end = endTime();
    const fmt = function (d, tm) { return d.replace(/-/g, "") + "T" + tm.replace(":", "") + "00"; };
    const url = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" +
      encodeURIComponent("【タスク】" + task.title) + "&dates=" + fmt(date, start) + "/" + fmt(date, end) +
      "&details=" + encodeURIComponent((task.requester ? "依頼元: " + task.requester + "。" : "") + "凪タスク帳より");
    window.open(url, "_blank");
    onPlanned(task.id, { date: date, start: start, end: end });
    onClose();
  };
  const recordOnly = function () {
    onPlanned(task.id, { date: date, start: start, end: endTime() });
    showToast("実行予定を記録しました");
    onClose();
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={function (e) { e.stopPropagation(); }}>
        <div className="bold" style={{ color: "var(--ink)", fontSize: "14px" }}>いつやる?</div>
        <div className="small muted mb3" style={{ wordBreak: "break-word" }}>{task.title}</div>

        <div className="grid2 mb3">
          <div>
            <label className="label">日付</label>
            <input className="input" type="date" value={date} onChange={function (e) { setDate(e.target.value); }} />
            <QuickDateChips value={date} onPick={setDate} />
          </div>
          <div>
            <label className="label">開始時刻</label>
            <input className="input" type="time" value={start} onChange={function (e) { setStart(e.target.value); }} />
          </div>
        </div>

        <label className="label">所要時間</label>
        <div className="row mb1">
          {[15, 30, 60, 90, 120].map(function (d) {
            return (
              <button key={d} className="btn btn-sm flex1" onClick={function () { setDur(d); }}
                style={dur === d ? { background: "var(--ink)", color: "#fff" } : { background: "var(--bg)", color: "var(--gray)", border: "1px solid var(--line)" }}>
                {d}分
              </button>
            );
          })}
        </div>
        <div className="small muted mb4">{fmtDate(date)} {start}〜{endTime()} で登録します</div>

        {connected ? (
          <button className="btn btn-ink btn-block mb2" onClick={autoRegister} disabled={busy}>
            {busy ? "登録中…" : "📅 カレンダーに自動登録"}
          </button>
        ) : (
          <button className="btn btn-ink btn-block mb2" onClick={openGcal}>📅 Googleカレンダーに登録(画面が開きます)</button>
        )}
        <div className="row">
          {connected && <button className="btn btn-ghost btn-sm flex1" onClick={openGcal}>Gカレンダーを開いて登録</button>}
          <button className="btn btn-ghost btn-sm flex1" onClick={recordOnly}>アプリ内だけ記録</button>
          <button className="btn btn-sm muted" onClick={onClose}>閉じる</button>
        </div>
      </div>
    </div>
  );
}

function TagColorModal({ tags, tasks, colors, onSet, onDelete, onClose }) {

    return { all: all.length, open: all.filter(function (t) { return t.status !== "done"; }).length };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={function (e) { e.stopPropagation(); }}>

        <div className="small muted mb3">色をタップで変更。使わなくなったタグは削除できます(タスク自体は消えません)</div>
        {tags.length === 0 && <div className="small muted">まだタグがありません。タスク編集画面で作れます</div>}
        <div className="stack">
          {tags.map(function (name) {

            return (
              <div key={name} style={{ borderTop: "1px solid var(--line)", paddingTop: "8px" }}>
                <div className="row mb1" style={{ justifyContent: "space-between" }}>
                  <div className="row">

                    <span className="small muted">未完了{countOf(name).open}件</span>

                  <div className="row">
                    {colors[name] && <button className="small muted" onClick={function () { onSet(name, ""); }}>色を戻す</button>}
                    <button className="small bold" style={{ color: "var(--accent)" }} onClick={function () {
                      const c = countOf(name);
                      if (window.confirm("タグ「" + name + "」を削除しますか?" + (c.all ? "\n(" + c.all + "件のタスクからこのタグが外れます。タスクは消えません)" : ""))) onDelete(name);
                    }}>🗑 削除</button>

                <div className="wrap">

                      <button key={c} onClick={function () { onSet(name, c); }} aria-label={"色 " + c}

                    );

            );
          })}
        </div>
        <button className="btn btn-ghost btn-block mt4" onClick={onClose}>閉じる</button>
      </div>
    </div>
  );

function BigTab({ data, toggleDone, onEdit, onAddSteps, onNewBig, showToast }) {
  const [showDone, setShowDone] = useState(false);
  const bigs = data.tasks
    .filter(function (t) { return isBig(t, data.tasks) && (showDone || t.status !== "done"); })
    .sort(function (a, b) {
      if ((a.status === "done") !== (b.status === "done")) return a.status === "done" ? 1 : -1;
      return sortByDue(a, b);
    })
    .map(function (t) { return { t: t, info: bigInfo(t, data.tasks) }; });
  const unsplit = bigs.filter(function (b) { return b.t.status !== "done" && b.info.total === 0; }).length;

  return (
    <div>
      <div className="card mb3" style={{ background: "#F6F8FC" }}>
        <div className="bold" style={{ fontSize: "14px", color: "var(--ink)" }}>🏔 大物タスク</div>
        <div className="small muted mt1" style={{ lineHeight: 1.7 }}>
          時間がかかる仕事は、15〜60分でできる「ステップ」に分けて、それぞれに期限を入れておくと、今日タブに1つずつ順番に出てきます。<br />
          「かかる量: 大」のタスク、またはステップを持つタスクがここに並びます。
        </div>
        {unsplit > 0 && <div className="small bold mt2" style={{ color: "#A65E00" }}>⚠ まだ分解されていない大物が{unsplit}件あります</div>}
        <div className="row mt3" style={{ justifyContent: "space-between" }}>
          <button className="btn btn-ink btn-sm" onClick={onNewBig}>＋ 大物を追加</button>
          <label className="small muted row" style={{ gap: "4px" }}>
            <input type="checkbox" checked={showDone} onChange={function (e) { setShowDone(e.target.checked); }} /> 完了した大物も表示
          </label>
        </div>
      </div>

      {bigs.length === 0 && (
        <div className="center muted xs" style={{ padding: "32px 0", lineHeight: 1.8 }}>
          大物タスクはまだありません。<br />タスク編集で「かかる量: 大」にするか、上の「＋ 大物を追加」から。
        </div>
      )}
      <div className="stack">
        {bigs.map(function (b) {
          return <BigCard key={b.t.id} b={b} allTags={data.tags} toggleDone={toggleDone} onEdit={onEdit} onAddSteps={onAddSteps} showToast={showToast} />;
        })}
      </div>
    </div>
  );
}

    const titles = text.split(/\r?\n/)

  return (
    <div className="card" style={{ padding: "12px", borderLeft: "4px solid " + (IMP_COLOR[t.importance] || "var(--gray)"), opacity: done ? .6 : 1 }}>
      <div className="row" style={{ alignItems: "flex-start" }}>

        <span className="chip bold" style={{ background: IMP_COLOR[t.importance] || "var(--gray)", color: "#fff" }}>{t.importance}</span>
        {(t.tags || []).map(function (tag) {
          return <span key={tag} className="chip" style={{ background: tagColor(tag, allTags), color: "#fff" }}>{tag}</span>;
        })}
        {t.requester && <span className="chip" style={{ background: "#F1EAF6", color: "#6B4E8A" }}>📩 {t.requester}</span>}
      </div>

      {info.total > 0 && (
        <div className="row mt2">
          <div className="progress-track flex1"><div className="progress-fill" style={{ width: pct + "%" }} /></div>
          <span className="small muted">{info.doneCount}/{info.total}({pct}%)</span>
        </div>
      )}
      {!done && info.next && !open && (
        <div className="xs mt2" style={{ color: "var(--ink-soft)", wordBreak: "break-word" }}>👉 次: {info.next.title}{info.next.due ? "(" + fmtDate(info.next.due) + ")" : ""}</div>
      )}
      {!done && info.idle !== null && info.idle >= 3 && (
        <div className="small bold mt1" style={{ color: "var(--accent)" }}>💤 {info.idle}日動いていません</div>
      )}

      <button className="small bold mt2" style={{ color: "var(--ink-soft)" }} onClick={function () { setOpen(!open); }}>
        {open ? "▲ 閉じる" : "▼ ステップを見る・追加する" + (info.total ? "(" + info.doneCount + "/" + info.total + ")" : "")}
      </button>

      {open && (
        <div className="mt2">
          {info.steps.map(function (s) {
            const sd = s.status === "done";
            const si = dueInfo(s.due, s.status);
            return (
              <div key={s.id} className="row" style={{ padding: "7px 0", borderTop: "1px solid var(--line)" }}>
                <button className={"check-circle" + (sd ? " done" : "")} style={{ flexShrink: 0 }} onClick={function () { toggleDone(s.id); }} aria-label="ステップ完了">{sd ? "✓" : ""}</button>
                <div className="flex1 xs" style={{ cursor: "pointer", wordBreak: "break-word", textDecoration: sd ? "line-through" : "none", color: sd ? "var(--gray)" : "inherit" }}
                  onClick={function () { onEdit(s); }}>{s.title}</div>
                {s.due
                  ? <span className="chip" style={{ background: si.bg, color: si.fg, flexShrink: 0 }}>{si.label}</span>
                  : (!sd && <span className="small" style={{ color: "#B09A5A", flexShrink: 0 }}>期限なし</span>)}
              </div>
            );
          })}

          {!done && (
            <React.Fragment>
              {info.total === 0 && (
                <div className="small mt1 mb2" style={{ background: "#FFF9EC", border: "1px solid #EFDDB0", color: "#5A4A20", borderRadius: "8px", padding: "8px 10px", lineHeight: 1.7 }}>
                  💡 分解のコツ: 「最初の15分でできること」から書く。<br />
                  例) 材料・資料を集める → 骨子を書く → ◯◯さんに確認 → 仕上げ → 提出
                </div>
              )}
              <textarea className="textarea input mt2" rows={2} value={text} onChange={function (e) { setText(e.target.value); }}
                placeholder={"ステップを入力(1行=1ステップ。まとめて貼り付けOK)"} />
              <div className="row mt2">
                <input type="date" className="input" style={{ flex: 1, width: "auto" }} value={due} onChange={function (e) { setDue(e.target.value); }} />
                <button className="btn btn-ink btn-sm" onClick={add}>＋ 追加</button>
              </div>
              <QuickDateChips value={due} onPick={setDue} />
              <div className="small muted mt1">↑ ここで選んだ期限が、今回追加するステップ全部に入ります(あとで個別に変更OK)</div>
              <button className="btn btn-ghost btn-sm btn-block mt3" onClick={function () { copyText(claudePrompt, function () { showToast("Claude用の依頼文をコピーしました"); }); }}>
                🤖 Claudeに分解を頼む(依頼文をコピー)
              </button>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
