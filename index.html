<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>凪タスク帳</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --ink:#1C2B4A; --ink-soft:#33456B; --accent:#D8402B; --amber:#DE9A18;
  --gray:#8A93A3; --bg:#F2F4F7; --line:#E3E7EE;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  background:var(--bg); color:#222B3A; -webkit-font-smoothing:antialiased;
}
button{font:inherit;border:none;background:none;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
.container{max-width:760px;margin:0 auto;padding:0 16px;}
.app-header{background:var(--ink);color:#fff;}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(20,28,48,.05);}
.btn{border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;}
.btn:active{opacity:.8;}
.btn-ink{background:var(--ink);color:#fff;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:8px;}
.btn:disabled{background:var(--gray);color:#fff;cursor:default;}
.btn-block{display:block;width:100%;}
.input,.select,.textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-size:13px;outline:none;width:100%;
}
.textarea{resize:none;line-height:1.6;}
.label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;}
.muted{color:var(--gray);}
.small{font-size:11px;}
.xs{font-size:12px;}
.bold{font-weight:700;}
.mt1{margin-top:4px;}.mt2{margin-top:8px;}.mt3{margin-top:12px;}.mt4{margin-top:16px;}
.mb1{margin-bottom:4px;}.mb2{margin-bottom:8px;}.mb3{margin-bottom:12px;}.mb4{margin-bottom:16px;}
.row{display:flex;gap:8px;align-items:center;}
.row-start{display:flex;gap:8px;align-items:flex-start;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.flex1{flex:1;min-width:0;}
.center{text-align:center;}
.stack>*+*{margin-top:8px;}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom);}
.nav-inner{max-width:760px;margin:0 auto;display:flex;}
.nav-btn{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--gray);border-top:2px solid transparent;}
.nav-btn.active{color:var(--ink);font-weight:700;border-top-color:var(--ink);}
.nav-icon{font-size:18px;line-height:1;}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,48,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;width:100%;max-width:440px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow-y:auto;}
@media(min-width:640px){
  .modal-bg{align-items:center;}
  .modal{border-radius:16px;}
}
.task-card{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:stretch;overflow:hidden;box-shadow:0 1px 2px rgba(20,28,48,.05);}
.imp-bar{width:4px;flex-shrink:0;}
.check-btn{padding:0 8px 0 12px;display:flex;align-items:center;flex-shrink:0;}
.check-circle{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--line);background:#fff;color:#fff;}
.check-circle.done{border-color:var(--ink);background:var(--ink);}
.progress-track{height:6px;border-radius:999px;background:var(--bg);overflow:hidden;}
.progress-fill{height:100%;background:var(--ink);}
.banner{background:#FCF0D8;border:1px solid #EFDDB0;color:#7A5C10;border-radius:10px;padding:8px 12px;font-size:12px;}
.tl-row{display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 8px;background:var(--bg);}
.tl-row.is-task{background:#FBF0EE;}
.tl-time{width:84px;flex-shrink:0;text-align:right;font-size:11px;font-weight:700;color:var(--ink-soft);}
.tl-row.is-task .tl-time{color:var(--accent);}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.filters .select{width:auto;font-size:11px;padding:6px 8px;background:#fff;flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const IMP_COLOR = { "高": "var(--accent)", "中": "var(--amber)", "低": "var(--gray)" };
const TAG_COLORS = ["#3B5BA5","#2E8B6F","#B25AA2","#C97B2D","#5A7D9A","#8A5AB2","#4A8FB5","#A5663B"];
const STORAGE_KEY = "nagi-tasks:data";

const DEFAULT_GUIDE = "【高】遅れると実害が出る・期限厳守\n ビザ/労務/給与/経営層への報告・稟議など\n\n【中】通常業務。期限はあるが1〜2日なら調整可\n 定例資料、店舗への連絡、面接調整など\n\n【低】改善・アイデア系。遅れても致命傷なし\n ツール改善、いつか読む資料など\n\n▼迷ったら「遅れたら誰が困る?」\n 会社・法令・経営層 → 高\n 現場・社外の相手 → 中\n 自分だけ → 低";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const fmtDate = (s) => {
  if (!s) return "";
  const p = s.split("-");
  return Number(p[1]) + "/" + Number(p[2]);
};
const daysUntil = (s) => {
  if (!s) return null;
  return Math.round((new Date(s) - new Date(todayStr())) / 86400000);
};
const dateToStr = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const tomorrowStr = () => { const d = new Date(); d.setDate(d.getDate() + 1); return dateToStr(d); };
const thisFridayStr = () => { const d = new Date(); d.setDate(d.getDate() + (5 - d.getDay() + 7) % 7); return dateToStr(d); };
const nextMondayStr = () => { const d = new Date(); d.setDate(d.getDate() + (((1 - d.getDay() + 7) % 7) || 7)); return dateToStr(d); };
const QuickDateChips = ({ value, onPick }) => (
  <div className="row mt1" style={{ flexWrap: "wrap", gap: "6px" }}>
    {[{ label: "今日", v: todayStr() }, { label: "明日", v: tomorrowStr() }, { label: "金曜", v: thisFridayStr() }, { label: "来週月", v: nextMondayStr() }].map(function (o) {
      return (
        <button key={o.label} className="chip" onClick={function () { onPick(o.v); }}
          style={value === o.v
            ? { background: "var(--ink)", color: "#fff", padding: "4px 12px" }
            : { background: "var(--bg)", color: "var(--ink-soft)", border: "1px solid var(--line)", padding: "4px 12px" }}>
          {o.label}
        </button>
      );
    })}
  </div>
);
const nextDue = (base, repeat, repeatDays) => {
  const d = new Date(base + "T00:00:00");
  if (repeat === "毎日") d.setDate(d.getDate() + 1);
  else if (repeat === "平日") { do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); }
  else if (repeat === "毎週") d.setDate(d.getDate() + 7);
  else if (repeat === "毎月") d.setMonth(d.getMonth() + 1);
  else if (repeat === "曜日" && repeatDays && repeatDays.length) {
    let i = 0;
    do { d.setDate(d.getDate() + 1); i++; } while (repeatDays.indexOf(d.getDay()) === -1 && i < 8);
  } else d.setDate(d.getDate() + 1);
  return dateToStr(d);
};

// かかる量 → 着手リードタイム(日)
const LEAD = { "小": 1, "中": 3, "大": 7 };
const startBy = (t) => {
  if (!t.due) return null;
  const d = new Date(t.due + "T00:00:00");
  d.setDate(d.getDate() - (LEAD[t.effort] || 3));
  return dateToStr(d);
};
const shouldStart = (t) => {
  if (t.status === "done" || !t.due) return false;
  const n = daysUntil(t.due);
  if (n === null || n <= 0) return false; // 期限当日・超過は「今日やる」側で表示
  return daysUntil(startBy(t)) <= 0;
};

// ===== 大物タスク(ステップ分解) =====
const day10 = (s) => (s ? String(s).slice(0, 10) : "");
const childrenOf = (tasks, id) => tasks.filter(function (x) { return x.parentId === id; });
const sortSteps = (steps, tasks) => steps.slice().sort(function (a, b) {
  const da = a.due || "9999-99-99", db = b.due || "9999-99-99";
  if (da !== db) return da < db ? -1 : 1;
  return tasks.indexOf(a) - tasks.indexOf(b);
});
const isBig = (t, tasks) => !t.parentId && (t.effort === "大" || tasks.some(function (x) { return x.parentId === t.id; }));
const bigInfo = (t, tasks) => {
  const steps = sortSteps(childrenOf(tasks, t.id), tasks);
  const done = steps.filter(function (s) { return s.status === "done"; });
  const next = steps.find(function (s) { return s.status !== "done"; }) || null;
  const marks = [day10(t.createdAt)]
    .concat(steps.map(function (s) { return day10(s.createdAt); }))
    .concat(done.map(function (s) { return day10(s.doneAt); }))
    .filter(Boolean).sort();
  const last = marks.length ? marks[marks.length - 1] : "";
  const idle = last ? -daysUntil(last) : null;
  return { steps: steps, doneCount: done.length, total: steps.length, next: next, idle: idle };
};
const sortByDue = (a, b) => {
  const da = a.due || "9999-99-99", db = b.due || "9999-99-99";
  return da < db ? -1 : da > db ? 1 : 0;
};

const copyText = (s, done) => {
  const fb = function () {
    const ta = document.createElement("textarea");
    ta.value = s; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { }
    document.body.removeChild(ta);
    if (done) done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(function () { if (done) done(); }).catch(fb);
  } else fb();
};
const dueInfo = (due, status) => {
  if (!due) return { label: "期限なし", bg: "#EEF0F4", fg: "var(--gray)" };
  const n = daysUntil(due);
  if (status === "done") return { label: fmtDate(due), bg: "#EEF0F4", fg: "var(--gray)" };
  if (n < 0) return { label: fmtDate(due) + " 期限切れ", bg: "#FBE3DF", fg: "var(--accent)" };
  if (n === 0) return { label: "今日まで", bg: "#FBE3DF", fg: "var(--accent)" };
  if (n === 1) return { label: "明日まで", bg: "#FCF0D8", fg: "#A66E00" };
  if (n <= 3) return { label: fmtDate(due) + " あと" + n + "日", bg: "#FCF0D8", fg: "#A66E00" };
  return { label: fmtDate(due), bg: "#EEF0F4", fg: "#5A6577" };
};
let TAG_CUSTOM = {}; // App が毎回 data.tagColors を入れる
const tagColor = (name, allTags) => TAG_CUSTOM[name] || TAG_COLORS[Math.max(0, allTags.indexOf(name)) % TAG_COLORS.length];
const TAG_PALETTE = ["#3B5BA5","#4A8FB5","#2E8B6F","#7A9A3A","#C9A227","#C97B2D","#D8402B","#C2447A","#B25AA2","#8A5AB2","#5A7D9A","#6B6F78"];
const MODE_LABEL = { quick: "⚡ すぐできる", ai: "🤖 AIでいける", daily: "🐢 毎日少しずつ", block: "🧱 時間をとる" };
const MODE_STYLE = {
  quick: { background: "#E4F0EA", color: "#2E6B50" },
  ai: { background: "#E3EAF8", color: "#3B5BA5" },
  daily: { background: "#EAF4F1", color: "#2C7A6B" },
  block: { background: "#FDF1E2", color: "#9A5B12" },
};
const isWaiting = (t) => t.status !== "done" && !!t.waiting;
const waitDays = (t) => (t.waitSince ? -daysUntil(day10(t.waitSince)) : null);
const plusDaysStr = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return dateToStr(d); };

// ===== ローカル保存(この端末のブラウザ内) =====
const store = {
  ok: (function () { try { localStorage.setItem("__nagi_t", "1"); localStorage.removeItem("__nagi_t"); return true; } catch (e) { return false; } })(),
  load: function () { try { const v = localStorage.getItem(STORAGE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  save: function (d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); return true; } catch (e) { return false; } },
};

// ===== クラウド同期(Googleスプレッドシート / GAS) =====
const CLOUD_KEY = "nagi-tasks:cloud";
const cloud = {
  load: function () { try { const v = localStorage.getItem(CLOUD_KEY); return v ? JSON.parse(v) : { url: "", token: "" }; } catch (e) { return { url: "", token: "" }; } },
  save: function (c) { try { localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); } catch (e) { } },
};
function cloudGet(cfg) {
  return fetch(cfg.url + "?token=" + encodeURIComponent(cfg.token)).then(function (r) { return r.json(); });
}
function cloudPost(cfg, data, baseRev) {
  return fetch(cfg.url, { method: "POST", body: JSON.stringify({ token: cfg.token, data: data, baseRev: baseRev || "" }) }).then(function (r) { return r.json(); });
}

// ===== シートとの差分・マージ =====
// シートに保存される項目だけで比較(表記ゆれで「更新あり」と誤判定しないため)
const normTask = (t) => JSON.stringify([
  t.id, t.title || "", t.status === "done" ? "done" : "open", t.due || "", t.importance || "中",
  t.requester || "", (t.tags || []).join(";"), t.repeat || "",
  t.planned ? [t.planned.date, t.planned.start, t.planned.end || ""].join("|") : "",
  t.note || "", t.doneAt || "", t.effort || "中", (t.repeatDays || []).join(","), t.parentId || "",
  t.waiting ? 1 : 0, t.waitFor || "", t.waitSince || "", t.remindAt || "", t.mode || "", t.touchedAt || "",
]);
const sameItem = (key, a, b) => key === "tasks" ? normTask(a) === normTask(b) : JSON.stringify(a) === JSON.stringify(b);
// 3者マージ: シートの最新(remote)に、この端末で変えた分(local と base の差)だけを重ねる
function mergeCollections(base, local, remote) {
  const out = Object.assign({}, remote);
  ["tasks", "memos", "questions", "members", "meetings", "reportNotes"].forEach(function (key) {
    const b = {}; (base[key] || []).forEach(function (x) { b[x.id] = x; });
    const l = {}; (local[key] || []).forEach(function (x) { l[x.id] = x; });
    let list = (remote[key] || []).slice();
    Object.keys(b).forEach(function (id) { if (!l[id]) list = list.filter(function (x) { return x.id !== id; }); });
    (local[key] || []).forEach(function (x) {
      const bx = b[x.id];
      if (!bx || !sameItem(key, x, bx)) {
        const i = list.findIndex(function (y) { return y.id === x.id; });
        if (i >= 0) list[i] = x; else list.push(x);
      }
    });
    out[key] = list;
  });
  ["tags", "impGuide", "tagColors"].forEach(function (k) {
    if (JSON.stringify(local[k]) !== JSON.stringify(base[k])) out[k] = local[k];
  });
  return out;
}
function diffTasks(oldTasks, newTasks) {
  const o = {}; (oldTasks || []).forEach(function (t) { o[t.id] = t; });
  const fresh = {};
  (newTasks || []).forEach(function (t) {
    if (!o[t.id]) fresh[t.id] = "new";
    else if (normTask(o[t.id]) !== normTask(t)) fresh[t.id] = "upd";
  });
  return fresh;
}

// ===== ファイル出力/読み込み =====
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
}
function csvEscape(v) {
  v = v == null ? "" : String(v);
  if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
const CSV_HEAD = ["タスク名","状態","期限","重要度","担当者","依頼元","タグ","繰り返し","実行予定日","開始","終了","メモ","作成日","完了日","かかる量","親タスク"];
function tasksToCsv(tasks) {
  const titleOf = {}; tasks.forEach(function (t) { titleOf[t.id] = t.title; });
  const rows = tasks.map(function (t) {
    return [
      t.title, t.status === "done" ? "完了" : (t.waiting ? "相手待ち" : "未完了"), t.due || "", t.importance || "",
      t.assignee || "", t.requester || "", (t.tags || []).join(";"), t.repeat || "",
      t.planned ? t.planned.date : "", t.planned ? t.planned.start : "", t.planned ? t.planned.end : "",
      t.note || "", t.createdAt || "", t.doneAt || "",
      t.effort || "中", t.parentId ? (titleOf[t.parentId] || "") : "",
    ];
  });
  return "\uFEFF" + [CSV_HEAD].concat(rows).map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
}
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ",") { row.push(field); field = ""; }
      else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (ch === "\r") { /* skip */ }
      else field += ch;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ""; }); });
}
function csvToTasks(text) {
  const rows = parseCsv(text);
  if (rows.length < 2) return [];
  const head = rows[0];
  const idx = function (name) { return head.indexOf(name); };
  const iTitle = idx("タスク名");
  if (iTitle === -1) return null; // ヘッダー不一致
  const get = function (r, name) { const i = idx(name); return i === -1 ? "" : (r[i] || "").trim(); };
  const list = rows.slice(1).map(function (r) {
    const title = (r[iTitle] || "").trim();
    if (!title) return null;
    const pd = get(r, "実行予定日"), ps = get(r, "開始"), pe = get(r, "終了");
    return {
      id: uid(), title: title,
      status: get(r, "状態") === "完了" ? "done" : "open",
      waiting: get(r, "状態") === "相手待ち",
      due: get(r, "期限"),
      importance: ["高","中","低"].indexOf(get(r, "重要度")) >= 0 ? get(r, "重要度") : "中",
      assignee: get(r, "担当者") || "自分",
      requester: get(r, "依頼元"),
      tags: get(r, "タグ") ? get(r, "タグ").split(";").map(function (s) { return s.trim(); }).filter(Boolean) : [],
      repeat: ["毎日","毎週","毎月"].indexOf(get(r, "繰り返し")) >= 0 ? get(r, "繰り返し") : "",
      planned: pd && ps ? { date: pd, start: ps, end: pe } : null,
      note: get(r, "メモ"),
      createdAt: get(r, "作成日") || todayStr(),
      doneAt: get(r, "完了日") || null,
      effort: ["小","中","大"].indexOf(get(r, "かかる量")) >= 0 ? get(r, "かかる量") : "中",
      parentTitle: get(r, "親タスク"),
      source: "import",
    };
  }).filter(Boolean);
  list.forEach(function (t) {
    const p = t.parentTitle ? list.find(function (x) { return x.title === t.parentTitle && x !== t; }) : null;
    t.parentId = p ? p.id : "";
    delete t.parentTitle;
  });
  return list;
}

const emptyData = { memos: [], questions: [], tasks: [], members: [], meetings: [], tags: [], tagColors: {}, impGuide: DEFAULT_GUIDE, reportNotes: [] };

// ============ アプリ本体 ============
const AppCtx = React.createContext({ fresh: {}, tasks: [] });

function App() {
  const [data, setData] = useState(function () {
    const saved = store.load();
    return saved ? Object.assign({}, emptyData, saved) : emptyData;
  });
  const [tab, setTab] = useState("today");
  const [editTask, setEditTask] = useState(null);
  const [scheduleTask, setScheduleTask] = useState(null);
  const [showData, setShowData] = useState(false);
  const [toast, setToast] = useState("");
  const [cloudCfg, setCloudCfg] = useState(cloud.load());
  const [sync, setSync] = useState(cloud.load().url ? "loading" : "off");
  const [lastPulled, setLastPulled] = useState("");
  const [fresh, setFresh] = useState({});

  const saveTimer = useRef(null);
  const toastTimer = useRef(null);
  const dataRef = useRef(data);
  const baseRef = useRef(data);     // 最後にシートと一致していた状態
  const revRef = useRef("");        // そのときのシートの版
  const cfgRef = useRef(cloudCfg);
  const pendingRef = useRef(false); // 保存待ち・保存中
  const lastPullAtRef = useRef(0);
  dataRef.current = data;
  cfgRef.current = cloudCfg;
  TAG_CUSTOM = data.tagColors || {};

  const showToast = function (msg) {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(function () { setToast(""); }, 2800);
  };
  const nowHM = function () {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  };
  const mergeRemote = function (remote) {
    const m = Object.assign({}, emptyData, remote);
    delete m.rev;
    if (!m.impGuide) m.impGuide = DEFAULT_GUIDE;
    return m;
  };
  const commitLocal = function (next) {
    dataRef.current = next;
    setData(next);
    if (store.ok) store.save(next);
  };
  const markFresh = function (diff) {
    const keys = Object.keys(diff);
    if (!keys.length) return { n: 0, u: 0 };
    setFresh(function (f) { return Object.assign({}, f, diff); });
    return {
      n: keys.filter(function (k) { return diff[k] === "new"; }).length,
      u: keys.filter(function (k) { return diff[k] === "upd"; }).length,
    };
  };

  // シートの内容をアプリに反映(何が増えた・変わったかも記録)
  const applyRemote = function (remote, opts) {
    opts = opts || {};
    const merged = mergeRemote(remote);
    const prev = dataRef.current;
    const c = opts.noDiff ? { n: 0, u: 0 } : markFresh(diffTasks(prev.tasks, merged.tasks));
    commitLocal(merged);
    baseRef.current = merged;
    revRef.current = remote.rev || "";
    lastPullAtRef.current = Date.now();
    setLastPulled(nowHM());
    setSync("ok");
    if (c.n || c.u) showToast("シートから読み込み: " + (c.n ? "新規" + c.n + "件 " : "") + (c.u ? "更新" + c.u + "件" : ""));
    else if (opts.toast) showToast(opts.toast);
  };

  const pullCloud = function (opts) {
    opts = opts || {};
    const cfg = cfgRef.current;
    if (!cfg.url) return;
    if (pendingRef.current) { if (!opts.silent) showToast("保存中です。少し待ってからもう一度どうぞ"); return; }
    setSync("loading");
    lastPullAtRef.current = Date.now();
    cloudGet(cfg).then(function (remote) {
      if (remote && Array.isArray(remote.tasks)) {
        if (pendingRef.current) { setSync("saving"); return; } // 読込中に編集が入ったら、その保存を優先
        applyRemote(remote, { toast: opts.silent ? "" : "最新の状態です", noDiff: opts.noDiff });
      } else { setSync("error"); if (!opts.silent) showToast("読み込みに失敗しました"); }
    }).catch(function () { setSync("error"); if (!opts.silent) showToast("読み込みに失敗しました"); });
  };

  // シートへ保存。別の場所(Claude・シート直接編集)で更新されていたら、取り込んでから保存し直す
  const pushData = function (payload, force, depth) {
    depth = depth || 0;
    const cfg = cfgRef.current;
    pendingRef.current = true;
    setSync("saving");
    return cloudPost(cfg, payload, force ? "" : revRef.current).then(function (res) {
      if (res && res.ok) {
        baseRef.current = payload;
        revRef.current = res.rev || "";
        pendingRef.current = !!saveTimer.current;
        setSync(saveTimer.current ? "saving" : "ok");
        return res;
      }
      if (res && res.conflict && res.data) {
        const remote = mergeRemote(res.data);
        const local = dataRef.current;
        const merged = mergeRemote(mergeCollections(baseRef.current, local, remote));
        const c = markFresh(diffTasks(local.tasks, merged.tasks));
        commitLocal(merged);
        baseRef.current = remote;
        revRef.current = res.data.rev || "";
        showToast("シートの更新を取り込んで保存しました" + (c.n ? "(新規" + c.n + "件)" : ""));
        return pushData(merged, depth >= 1, depth + 1);
      }
      pendingRef.current = false;
      setSync("error");
      return res;
    }).catch(function () { pendingRef.current = false; setSync("error"); });
  };

  const update = function (next) {
    commitLocal(next);
    if (!cfgRef.current.url) return;
    pendingRef.current = true;
    setSync("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function () {
      saveTimer.current = null;
      pushData(dataRef.current, false);
    }, 1200);
  };

  // 起動時+アプリに戻ってきた時に、シートを自動で読み込み直す
  useEffect(function () {
    if (cfgRef.current.url) pullCloud({ silent: true, noDiff: dataRef.current.tasks.length === 0 });
    const onBack = function () {
      if (document.visibilityState !== "visible") return;
      if (Date.now() - lastPullAtRef.current < 15000) return;
      pullCloud({ silent: true });
    };
    document.addEventListener("visibilitychange", onBack);
    window.addEventListener("focus", onBack);
    return function () {
      document.removeEventListener("visibilitychange", onBack);
      window.removeEventListener("focus", onBack);
    };
  }, []);

  // ---- タスク操作 ----
  const patchTasks = function (fn) {
    const d = dataRef.current;
    update(Object.assign({}, d, { tasks: fn(d.tasks) }));
  };
  const markDone = function (t) { return Object.assign({}, t, { status: "done", doneAt: todayStr() }); };

  const saveTask = function (task, newTags) {
    newTags = newTags || [];
    const d = dataRef.current;
    const exists = d.tasks.some(function (t) { return t.id === task.id; });
    const tasks = exists ? d.tasks.map(function (t) { return t.id === task.id ? task : t; }) : d.tasks.concat([task]);
    const memos = task.fromMemoId ? d.memos.filter(function (m) { return m.id !== task.fromMemoId; }) : d.memos;
    const tags = d.tags.slice();
    newTags.forEach(function (n) { if (tags.indexOf(n) === -1) tags.push(n); });
    update(Object.assign({}, d, { tasks: tasks, memos: memos, tags: tags }));
    setEditTask(null);
    showToast(exists ? "タスクを更新しました" : "タスクを追加しました");
  };
  const saveGuide = function (text) { update(Object.assign({}, dataRef.current, { impGuide: text })); };

  const toggleDone = function (id) {
    const d = dataRef.current;
    const target = d.tasks.find(function (t) { return t.id === id; });
    if (!target) return;
    const nowDone = target.status !== "done";
    let tasks = d.tasks.map(function (t) {
      return t.id === id
        ? Object.assign({}, t, { status: nowDone ? "done" : "open", doneAt: nowDone ? todayStr() : null }, nowDone ? { waiting: false } : {})
        : t;
    });
    let msg = "";
    if (nowDone && target.repeat) {
      const base = target.due || todayStr();
      tasks = tasks.concat([Object.assign({}, target, { id: uid(), status: "open", doneAt: null, planned: null, waiting: false, waitFor: "", waitSince: "", remindAt: "", due: nextDue(base, target.repeat, target.repeatDays), createdAt: todayStr() })]);
      msg = "完了!次回(" + target.repeat + ")分を作成しました";
    }
    // 大物を完了 → 残りのステップもまとめて?
    if (nowDone && !target.parentId) {
      const openSteps = tasks.filter(function (t) { return t.parentId === id && t.status !== "done"; });
      if (openSteps.length && window.confirm("未完了のステップが" + openSteps.length + "件あります。ステップもまとめて完了にしますか?")) {
        tasks = tasks.map(function (t) { return t.parentId === id && t.status !== "done" ? markDone(t) : t; });
      }
    }
    // 最後のステップを完了 → 大物も完了?
    if (nowDone && target.parentId) {
      const parent = tasks.find(function (t) { return t.id === target.parentId; });
      const sibs = tasks.filter(function (t) { return t.parentId === target.parentId; });
      if (parent && parent.status !== "done" && sibs.every(function (s) { return s.status === "done"; })) {
        if (window.confirm("🎉 全ステップ完了!\n「" + parent.title + "」も完了にしますか?")) {
          tasks = tasks.map(function (t) { return t.id === parent.id ? markDone(t) : t; });
        }
      } else if (parent) {
        const left = sibs.filter(function (s) { return s.status !== "done"; }).length;
        msg = "ナイス!「" + parent.title + "」残り" + left + "ステップ";
      }
    }
    update(Object.assign({}, d, { tasks: tasks }));
    if (msg) showToast(msg);
  };

  const deleteTask = function (id) {
    const d = dataRef.current;
    const kids = d.tasks.filter(function (t) { return t.parentId === id; });
    if (kids.length && !window.confirm("このタスクのステップ" + kids.length + "件もまとめて削除します。よろしいですか?")) return;
    update(Object.assign({}, d, { tasks: d.tasks.filter(function (t) { return t.id !== id && t.parentId !== id; }) }));
    setEditTask(null);
    showToast("タスクを削除しました");
  };
  const setPlanned = function (taskId, planned) {
    patchTasks(function (tasks) { return tasks.map(function (t) { return t.id === taskId ? Object.assign({}, t, { planned: planned }) : t; }); });
  };
  const patchTask = function (taskId, fields, msg) {
    patchTasks(function (tasks) { return tasks.map(function (t) { return t.id === taskId ? Object.assign({}, t, fields) : t; }); });
    if (msg) showToast(msg);
  };
  const deleteTag = function (name) {
    const d = dataRef.current;
    const tc = Object.assign({}, d.tagColors || {});
    delete tc[name];
    update(Object.assign({}, d, {
      tags: d.tags.filter(function (x) { return x !== name; }),
      tagColors: tc,
      tasks: d.tasks.map(function (t) {
        return (t.tags || []).indexOf(name) >= 0 ? Object.assign({}, t, { tags: t.tags.filter(function (x) { return x !== name; }) }) : t;
      }),
    }));
    showToast("タグ「" + name + "」を削除しました");
  };
  const setTagColor = function (name, color) {
    const d = dataRef.current;
    const tc = Object.assign({}, d.tagColors || {});
    if (color) tc[name] = color; else delete tc[name];
    update(Object.assign({}, d, { tagColors: tc }));
  };
  const setDue = function (taskId, due) {
    patchTasks(function (tasks) { return tasks.map(function (t) { return t.id === taskId ? Object.assign({}, t, { due: due }) : t; }); });
    showToast("期限を " + fmtDate(due) + " にしました");
  };
  const addSteps = function (parentId, titles, due) {
    const d = dataRef.current;
    const parent = d.tasks.find(function (t) { return t.id === parentId; });
    if (!parent) return;
    const steps = titles.map(function (title) {
      return {
        id: uid(), title: title, note: "", due: due || "", importance: parent.importance || "中", assignee: "自分",
        requester: "", tags: (parent.tags || []).slice(), repeat: "", repeatDays: [], effort: "小",
        planned: null, status: "open", source: "step", parentId: parentId, createdAt: todayStr(),
      };
    });
    update(Object.assign({}, d, { tasks: d.tasks.concat(steps) }));
    showToast(steps.length + "ステップ追加しました");
  };

  // ---- シート接続 ----
  const connectCloud = function (cfg) {
    setSync("loading");
    showToast("接続しています…");
    cloudGet(cfg).then(function (remote) {
      if (!remote || !Array.isArray(remote.tasks)) {
        setSync("error");
        window.alert("応答が不正です。合言葉(TOKEN)が一致しているか、GASコードの貼り付け・デプロイ設定を確認してください。");
        return;
      }
      cloud.save(cfg);
      cfgRef.current = cfg;
      setCloudCfg(cfg);
      const local = dataRef.current;
      const remoteHas = remote.tasks.length > 0 || (remote.memos || []).length > 0;
      const localHas = local.tasks.length > 0 || local.memos.length > 0;
      if (!remoteHas && localHas) {
        pushData(local, true).then(function () { showToast("この端末のデータをシートに書き込みました"); });
      } else if (remoteHas && localHas && !window.confirm("スプレッドシート側に既にデータがあります。\nOK: シートのデータをこの端末に読み込む(推奨)\nキャンセル: この端末のデータでシートを上書き")) {
        pushData(local, true).then(function () { showToast("この端末のデータで上書きしました"); });
      } else {
        applyRemote(remote, { toast: "接続しました", noDiff: true });
      }
    }).catch(function () {
      setSync("error");
      window.alert("接続に失敗しました。URL・合言葉と、デプロイの「アクセスできるユーザー: 全員」設定を確認してください。");
    });
  };
  const pushNow = function () {
    if (!cfgRef.current.url) return;
    pushData(dataRef.current, true).then(function (res) {
      showToast(res && res.ok ? "スプレッドシートに書き込みました" : "書き込みに失敗しました");
    });
  };
  const disconnectCloud = function () {
    cloud.save({ url: "", token: "" });
    cfgRef.current = { url: "", token: "" };
    setCloudCfg({ url: "", token: "" });
    setSync("off");
    showToast("接続を解除しました(データは端末とシートに残ります)");
  };

  const openCount = data.tasks.filter(function (t) { return t.status !== "done"; }).length;
  const overdueCount = data.tasks.filter(function (t) { return t.status !== "done" && t.due && daysUntil(t.due) < 0; }).length;

  const newTaskTemplate = function (extra) {
    return Object.assign({
      id: uid(), title: "", note: "", due: "", importance: "中", assignee: "自分", parentId: "",
      waiting: false, waitFor: "", waitSince: "", remindAt: "", mode: "",
      requester: "", tags: [], repeat: "", repeatDays: [], effort: "中", planned: null, status: "open", source: "direct", createdAt: todayStr(),
    }, extra || {});
  };
  const openEdit = function (t) { setEditTask(Object.assign({}, t)); };
  const openSchedule = function (t, init) { setScheduleTask(Object.assign({}, t, { _init: init || null })); };

  const waitAll = data.tasks.filter(isWaiting);
  const waitHot = waitAll.filter(function (t) { return t.remindAt && daysUntil(t.remindAt) <= 0; }).length;
  const NAV = [
    { key: "today", label: "今日", icon: "📆" },
    { key: "tasks", label: "タスク", icon: "☑️" },
    { key: "wait", label: "待ち", icon: "⏳", badge: waitAll.length, hot: waitHot > 0 },
    { key: "big", label: "大物", icon: "🏔" },
    { key: "memo", label: "メモ", icon: "✏️" },
  ];

  const syncLabel = sync === "off" ? "☁️ 未接続"
    : sync === "loading" ? "↻ 読込中…"
    : sync === "saving" ? "↻ 保存中…"
    : sync === "error" ? "⚠️ 再読込"
    : "🔄 " + (lastPulled ? lastPulled + " 読込" : "同期済");

  return (
    <AppCtx.Provider value={{ fresh: fresh, tasks: data.tasks }}>
    <div style={{ minHeight: "100vh" }}>
      <header className="app-header">
        <div className="container header-inner">
          <div>
            <div className="bold" style={{ fontSize: "15px", letterSpacing: ".04em" }}>凪タスク帳</div>
            <div className="small" style={{ opacity: .7 }}>
              未完了 <b>{openCount}</b>{overdueCount > 0 && <span className="bold" style={{ color: "#FFB4A6" }}> ・期限切れ {overdueCount}</span>}
            </div>
          </div>
          <div className="row">
            <button className="small" title="シートから読み込み直す"
              onClick={function () { if (cfgRef.current.url) pullCloud({}); else setShowData(true); }}
              style={{ color: "#fff", background: sync === "error" ? "rgba(216,64,43,.55)" : "rgba(255,255,255,.14)", borderRadius: "999px", padding: "5px 11px", whiteSpace: "nowrap" }}>
              {syncLabel}
            </button>
            <button onClick={function () { setShowData(true); }} title="データ・連携の設定"
              style={{ fontSize: "20px", padding: "4px 2px 4px 4px" }}>💾</button>
          </div>
        </div>
      </header>

      <main className="container" style={{ paddingTop: "16px", paddingBottom: "92px" }}>
        {!store.ok && (
          <div className="banner mb3">
            ⚠️ この環境では自動保存できません(プレビュー画面など)。ファイルをダウンロードしてブラウザで開くと、この端末に自動保存されます。
          </div>
        )}
        {tab === "today" && (
          <TodayTab data={data} toggleDone={toggleDone} cloudCfg={cloudCfg} showToast={showToast}
            onEdit={openEdit} onSchedule={openSchedule} onSetDue={setDue} onPatch={patchTask}
            onGoBig={function () { setTab("big"); }}
            onGoWait={function () { setTab("wait"); }}
            fresh={fresh} onClearFresh={function () { setFresh({}); }} />
        )}
        {tab === "tasks" && <TaskTab data={data} toggleDone={toggleDone} onNew={function () { setEditTask(newTaskTemplate()); }} onEdit={openEdit} onSchedule={openSchedule} onSetTagColor={setTagColor} onDeleteTag={deleteTag} />}
        {tab === "wait" && (
          <WaitTab data={data} toggleDone={toggleDone} onEdit={openEdit} onPatch={patchTask}
            onNewWait={function () { setEditTask(newTaskTemplate({ waiting: true, waitSince: todayStr(), remindAt: plusDaysStr(3) })); }} />
        )}
        {tab === "big" && (
          <BigTab data={data} toggleDone={toggleDone} onEdit={openEdit} onAddSteps={addSteps} showToast={showToast}
            onNewBig={function () { setEditTask(newTaskTemplate({ effort: "大", importance: "高" })); }} />
        )}
        {tab === "memo" && <MemoTab data={data} update={update} showToast={showToast} onMakeTask={function (memo) { setEditTask(newTaskTemplate(memo.id ? { title: memo.text, source: "memo", fromMemoId: memo.id } : { title: memo.text })); }} />}
      </main>

      {editTask && (
        <TaskModal task={editTask} members={data.members} allTags={data.tags} allTasks={data.tasks}
          impGuide={data.impGuide || DEFAULT_GUIDE} onSaveGuide={saveGuide}
          onSave={saveTask} onDelete={deleteTask} onClose={function () { setEditTask(null); }} />
      )}
      {scheduleTask && (
        <ScheduleModal task={scheduleTask} onPlanned={setPlanned} showToast={showToast} cloudCfg={cloudCfg} onClose={function () { setScheduleTask(null); }} />
      )}
      {showData && (
        <DataModal data={data} update={update} showToast={showToast} onClose={function () { setShowData(false); }}
          cloudCfg={cloudCfg} sync={sync} onConnect={connectCloud} onPull={function () { pullCloud({}); }} onPush={pushNow} onDisconnect={disconnectCloud} />
      )}

      {toast && (
        <div style={{ position: "fixed", left: "50%", transform: "translateX(-50%)", bottom: "96px", zIndex: 60, background: "var(--ink)", color: "#fff", fontSize: "13px", padding: "8px 16px", borderRadius: "999px", maxWidth: "92vw", textAlign: "center", boxShadow: "0 4px 12px rgba(20,28,48,.3)" }}>
          {toast}
        </div>
      )}

      <nav className="nav">
        <div className="nav-inner">
          {NAV.map(function (t) {
            return (
              <button key={t.key} className={"nav-btn" + (tab === t.key ? " active" : "")} onClick={function () { setTab(t.key); }} style={{ position: "relative" }}>
                {t.badge > 0 && (
                  <span style={{ position: "absolute", top: "3px", left: "50%", marginLeft: "6px", minWidth: "16px", height: "16px", borderRadius: "999px", padding: "0 4px", fontSize: "10px", lineHeight: "16px", fontWeight: 700, color: "#fff", background: t.hot ? "var(--accent)" : "#8A5AB2" }}>{t.badge}</span>
                )}
                <span className="nav-icon">{t.icon}</span>
                {t.label}
              </button>
            );
          })}
        </div>
      </nav>
    </div>
    </AppCtx.Provider>
  );
}

// ============ データ出力/読み込み ============
function DataModal({ data, update, showToast, onClose, cloudCfg, sync, onConnect, onPull, onPush, onDisconnect }) {
  const fileRef = useRef(null);
  const [url, setUrl] = useState(cloudCfg.url || "");
  const [token, setToken] = useState(cloudCfg.token || "");

  const exportCsv = function () {
    download("凪タスク帳_タスク_" + todayStr() + ".csv", tasksToCsv(data.tasks), "text/csv;charset=utf-8");
    showToast("CSVを出力しました");
  };
  const exportJson = function () {
    download("凪タスク帳_バックアップ_" + todayStr() + ".json", JSON.stringify(data, null, 2), "application/json");
    showToast("バックアップを出力しました");
  };
  const onFile = function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      const text = String(reader.result);
      if (/\.json$/i.test(file.name)) {
        try {
          const parsed = JSON.parse(text);
          if (!parsed || !Array.isArray(parsed.tasks)) throw new Error("bad");
          if (window.confirm("バックアップを読み込みます。この端末の現在のデータは置き換えられます。よろしいですか?")) {
            update(Object.assign({}, emptyData, parsed));
            showToast("バックアップを読み込みました(" + parsed.tasks.length + "件のタスク)");
            onClose();
          }
        } catch (err) {
          window.alert("JSONの読み込みに失敗しました。凪タスク帳のバックアップファイルか確認してください。");
        }
      } else {
        const tasks = csvToTasks(text);
        if (tasks === null) {
          window.alert("CSVのヘッダーが一致しません。1行目に「タスク名」列が必要です(このアプリのCSV出力形式に合わせてください)。");
        } else if (tasks.length === 0) {
          window.alert("読み込めるタスクがありませんでした。");
        } else {
          const tags = data.tags.slice();
          tasks.forEach(function (t) { (t.tags || []).forEach(function (n) { if (tags.indexOf(n) === -1) tags.push(n); }); });
          update(Object.assign({}, data, { tasks: data.tasks.concat(tasks), tags: tags }));
          showToast(tasks.length + "件のタスクを追加しました");
          onClose();
        }
      }
      e.target.value = "";
    };
    reader.readAsText(file, "UTF-8");
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={function (e) { e.stopPropagation(); }}>
        <div className="bold mb1" style={{ color: "var(--ink)", fontSize: "14px" }}>💾 データと連携</div>
        <div className="small muted mb3">スプレッドシートに接続すると、変更が自動でシートに書き込まれ、開くたびにシートから読み込まれます。</div>

        <div className="label">☁️ スプレッドシート連携</div>
        {cloudCfg.url ? (

// ============ 今日のタイムライン(空き時間の見える化) ============
const DAY_KEY = "nagi-tasks:day";
const DAY_DEFAULT = { start: 9, end: 19, ignore: ["起床", "寝る"] };
const loadDaySet = () => {
  try { const v = localStorage.getItem(DAY_KEY); return v ? Object.assign({}, DAY_DEFAULT, JSON.parse(v)) : DAY_DEFAULT; }
  catch (e) { return DAY_DEFAULT; }
};
const saveDaySet = (s) => { try { localStorage.setItem(DAY_KEY, JSON.stringify(s)); } catch (e) { } };
const toMin = (hm) => { if (!hm) return null; const p = String(hm).split(":"); const m = Number(p[0]) * 60 + Number(p[1] || 0); return isNaN(m) ? null : m; };
const toHM = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const fmtDur = (min) => (min >= 60 ? Math.floor(min / 60) + "時間" + (min % 60 ? (min % 60) + "分" : "") : min + "分");
const nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

function calcDay(events, planned, set, nowMin) {
  const ws = set.start * 60, we = set.end * 60;
  const items = [], outside = [], allDay = [];
  (events || []).forEach(function (e) {
    if (e.allDay) { allDay.push(e.title); return; }
    const s = toMin(e.start); let en = toMin(e.end);
    if (s === null || en === null) return;
    if (en <= s) en = 24 * 60; // 23:30〜00:00 のような日またぎ
    if (en <= ws || s >= we) { outside.push(e.start + " " + e.title); return; }
    items.push({ kind: "event", title: e.title, s: Math.max(s, ws), e: Math.min(en, we), rs: e.start, re: e.end, ignored: set.ignore.indexOf(e.title) >= 0 });
  });
  (planned || []).forEach(function (t) {
    const s = toMin(t.planned.start); if (s === null) return;
    let en = toMin(t.planned.end); if (en === null || en <= s) en = s + 60;
    if (en <= ws || s >= we) { outside.push(t.planned.start + " ☑️" + t.title); return; }
    items.push({ kind: "task", title: t.title, task: t, s: Math.max(s, ws), e: Math.min(en, we), rs: t.planned.start, re: t.planned.end || toHM(en) });
  });

  // 重なる予定は横に並べる
  items.sort(function (a, b) { return a.s - b.s || (b.e - b.s) - (a.e - a.s); });
  let cluster = [], cols = [], clusterEnd = -1;
  const closeCluster = function () { cluster.forEach(function (it) { it.cols = cols.length; }); cluster = []; cols = []; };
  items.forEach(function (it) {
    if (it.ignored) { it.col = 0; it.cols = 1; return; } // 空き扱いの予定は背景に敷くだけ(列をとらない)
    if (it.s >= clusterEnd) { closeCluster(); clusterEnd = it.e; } else clusterEnd = Math.max(clusterEnd, it.e);
    let c = cols.findIndex(function (end) { return end <= it.s; });
    if (c === -1) { c = cols.length; cols.push(it.e); } else cols[c] = it.e;
    it.col = c; cluster.push(it);
  });
  closeCluster();

  // 空き時間(今から終業まで、30分以上のすき間)
  const busy = items.filter(function (i) { return !i.ignored; }).map(function (i) { return [i.s, i.e]; }).sort(function (a, b) { return a[0] - b[0]; });
  const from = Math.max(ws, Math.ceil(nowMin / 15) * 15);
  const free = [];
  let cur = from;
  busy.forEach(function (b) {
    if (b[1] <= cur) return;
    if (b[0] > cur && b[0] - cur >= 30) free.push({ s: cur, e: b[0] });
    cur = Math.max(cur, b[1]);
  });
  if (we - cur >= 30) free.push({ s: cur, e: we });

  const meetingMin = items.filter(function (i) { return i.kind === "event" && !i.ignored; }).reduce(function (a, i) { return a + (i.e - i.s); }, 0);
  const freeMin = free.reduce(function (a, f) { return a + (f.e - f.s); }, 0);
  return { items: items, free: free, outside: outside, allDay: allDay, meetingMin: meetingMin, freeMin: freeMin };
}

                空き {toHM(f.s)}〜{toHM(f.e)}({fmtDur(f.e - f.s)})<span style={{ marginLeft: "auto" }}>＋ タスクを入れる</span>
              </button>
            );
          })}
          {d.items.filter(function (it) { return !it.ignored; }).map(function (it, i) {

                  left: "calc(" + (it.col / it.cols * 100) + "% + " + (it.col ? 2 : 0) + "px)",
                  width: "calc(" + (100 / it.cols) + "% - " + (it.cols > 1 ? 2 : 0) + "px)",
                  borderRadius: "6px", padding: "2px 6px", fontSize: "11px", overflow: "hidden", cursor: "pointer", lineHeight: 1.35, boxSizing: "border-box", zIndex: 2,
                }, style)}>
                <div className="bold" style={{ whiteSpace: h < 30 ? "nowrap" : "normal", overflow: "hidden", textOverflow: "ellipsis" }}>{isTask ? "☑️ " : ""}{it.title}</div>

              </div>
            );

          {nowMin > ws && nowMin < we && (
            <React.Fragment>
              <div style={{ position: "absolute", top: 0, height: top(nowMin) + "px", left: 0, right: 0, background: "rgba(242,244,247,.55)", pointerEvents: "none", borderRadius: "4px" }} />

      {d.outside.length > 0 && <div className="small muted mt2">勤務時間外: {d.outside.join(" / ")}</div>}
      <div className="small muted mt1">緑の点線 = これからの空き時間(タップでタスクを入れられます)。個人の予定はタップで「空き扱い」にできます</div>
